<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>三国志 · 郡国疆域与人物年表（陈寿《三国志》及裴松之注资料整理工具）</title>
<style>
:root{
  --bg:#12161d; --panel:#1a2029; --panel2:#202834; --ink:#e8e2d5; --ink2:#a8a192;
  --line:#333c4a; --wei:#5b8dd6; --shu:#58a05c; --wu:#d6655b; --qun:#c9a445; --jin:#9b7bc4; --oth:#8a93a6;
  --war:#e2703a; --pol:#e0b84f; --dip:#4fb8c9; --othE:#9aa2ad;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:linear-gradient(180deg,#1c2430,#151b23);border-bottom:1px solid var(--line);flex-wrap:wrap;z-index:50}
h1{font-family:var(--serif);font-size:20px;letter-spacing:2px;font-weight:600;white-space:nowrap}
h1 small{font-size:12px;color:var(--ink2);letter-spacing:1px;margin-left:8px}
#searchBox{position:relative;flex:1;min-width:260px;max-width:560px}
#q{width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#0e1218;color:var(--ink);font-size:14px;outline:none}
#q:focus{border-color:#5b8dd6}
#results{position:absolute;top:110%;left:0;right:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;max-height:420px;overflow:auto;display:none;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.res{padding:8px 12px;cursor:pointer;border-bottom:1px solid #2a3340;display:flex;gap:8px;align-items:baseline}
.res:hover{background:#2a3546}
.res .tag{font-size:11px;padding:1px 6px;border-radius:4px;color:#fff;flex:none}
.res .sub{color:var(--ink2);font-size:12px;margin-left:auto;flex:none}
.tabs{display:flex;gap:6px}
.tab{padding:7px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--ink2);font-size:14px}
.tab.on{background:#2b3a52;color:var(--ink);border-color:#5b8dd6}
#stats{font-size:12px;color:var(--ink2);white-space:nowrap}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
/* ===== 地图 ===== */
#mapWrap{flex:1;position:relative;overflow:hidden;background:#0e1420}
#mapSvg{width:100%;height:100%;cursor:grab}
#ovSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
#ovSvg circle,#ovSvg path,#ovSvg text{pointer-events:auto}
#tiles{position:absolute;inset:0;overflow:hidden;background:#0b0f15}
#mapSvg:active{cursor:grabbing}
#mapTip{position:absolute;pointer-events:none;background:rgba(10,14,20,.92);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;display:none;z-index:20;max-width:280px}
#mapPanel{position:absolute;top:12px;right:12px;width:300px;max-height:calc(100% - 90px);overflow:auto;background:rgba(24,30,40,.95);border:1px solid var(--line);border-radius:10px;padding:14px;display:none;z-index:15}
#mapPanel h3{font-family:var(--serif);font-size:18px;margin-bottom:6px}
#mapPanel .row{display:flex;gap:6px;margin:4px 0;font-size:13px}
#mapPanel .k{color:var(--ink2);flex:none;width:62px}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;color:#fff}
.mapCtl{position:absolute;left:12px;top:12px;z-index:15;display:flex;flex-direction:column;gap:8px}
.mapCtl select,.mapCtl button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer}
.mapCtl button:hover{background:#2b3547}
#mapLegend{position:absolute;left:12px;bottom:12px;z-index:15;background:rgba(24,30,40,.92);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12px;display:none}
#mapLegend .li{display:flex;align-items:center;gap:8px;margin:3px 0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.hlt{animation:pulse 1.6s ease-in-out 3}
@keyframes pulse{0%,100%{filter:none}50%{filter:brightness(1.9) drop-shadow(0 0 8px #ffd977)}}
/* ===== 时间轴 ===== */
#tlBar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:13px}
#tlBar label{display:flex;align-items:center;gap:4px;cursor:pointer;color:var(--ink2)}
#tlBar input[type=text]{background:#0e1218;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:5px 8px;width:120px;outline:none}
.btn{background:#2b3a52;color:var(--ink);border:1px solid #46618c;border-radius:7px;padding:5px 12px;cursor:pointer;font-size:13px}
.btn:hover{background:#34486b}
#tlWrap{flex:1;display:flex;overflow:hidden}
#nameCol{width:200px;flex:none;background:var(--panel);border-right:1px solid var(--line);position:relative;overflow:hidden}
#nameBox{position:absolute;inset:0;overflow:hidden}
#nameScroll{width:100%}
#nameScroll .gap{height:172px;flex:none}
.nrow{height:24px;display:flex;align-items:center;padding:0 8px;gap:6px;cursor:pointer;font-size:13px;border-bottom:1px solid #ffffff08}
.nrow:hover{background:#ffffff10}
.nrow .ny{margin-left:auto;font-size:10px;color:#5f6875;flex:none}
.ngrp{height:30px;display:flex;align-items:center;font-family:var(--serif);letter-spacing:3px;color:#d8cfb8;background:#1c232d;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-left:8px;font-size:14px}
.ngrp small{letter-spacing:0;color:#6d7684;margin-left:8px;font-size:11px}
#tlScroll{flex:1;overflow:auto;position:relative}
#tlCanvas{position:relative}
.ygrid{position:absolute;top:0;bottom:0;width:1px;background:#232b37}
.ygrid.major{background:#31405280}
.ylab{position:absolute;top:4px;font-size:11px;color:#6d7684;transform:translateX(-50%)}
.evFlag{position:absolute;transform:translateX(-50%);cursor:pointer;text-align:center;line-height:1;font-size:15px;z-index:5}
.evFlag .lb{display:block;font-size:10px;color:#c8c0ae;max-width:130px;white-space:normal;line-height:1.25;margin-top:1px;text-shadow:0 1px 3px #000}
.evLaneLab{position:absolute;left:4px;font-size:10px;color:#59636f}
.prow{position:absolute;left:0;right:0;height:24px;cursor:pointer;border-radius:4px}
.prow:hover{background:#ffffff10}
.pline{position:absolute;height:2px;top:11px;border-radius:2px}
.pdot{position:absolute;top:7px;width:10px;height:10px;border-radius:50%;transform:translateX(-50%);border:2px solid #0e1218}
.pdie{position:absolute;top:6px;transform:translateX(-50%);font-size:12px;color:#e8e2d5;text-shadow:0 1px 2px #000}
.grp{position:absolute;left:0;font-family:var(--serif);font-size:14px;color:#d8cfb8;background:#1c232d;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-left:8px;display:flex;align-items:center;letter-spacing:3px}
.grp small{letter-spacing:0;color:#6d7684;margin-left:8px;font-size:11px}
.nullbox{position:absolute;left:8px;right:8px;background:#171d26;border:1px dashed #39424f;border-radius:8px;padding:8px 10px}
.nullchip{display:inline-block;margin:3px 4px;padding:3px 10px;border-radius:12px;border:1px solid var(--line);cursor:pointer;font-size:12px;color:var(--ink2)}
.nullchip:hover{color:var(--ink);border-color:#5b8dd6}
#playBox{position:absolute;right:14px;bottom:14px;z-index:30;background:rgba(24,30,40,.96);border:1px solid var(--line);border-radius:10px;padding:12px;width:330px;display:none}
#playBox h4{font-size:13px;margin-bottom:6px;color:#d8cfb8}
#playList{max-height:180px;overflow:auto;font-size:12px;color:var(--ink2);line-height:1.7}
#playList b{color:var(--ink)}
#cursor{position:absolute;top:0;bottom:0;width:2px;background:#ffd977;box-shadow:0 0 8px #ffd977;display:none;z-index:8}
#cursorYear{position:absolute;top:150px;transform:translateX(6px);background:#ffd977;color:#111;font-weight:700;font-size:12px;padding:1px 7px;border-radius:4px;display:none;z-index:9}
#tlLegend{position:absolute;right:14px;top:14px;z-index:25;background:rgba(24,30,40,.94);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12px}
#tlLegend .li{display:flex;align-items:center;gap:7px;margin:3px 0;color:var(--ink2)}
/* ===== 郡县表 ===== */
#tblWrap{flex:1;overflow:auto;padding:12px 16px}
#tblQ{width:280px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:#0e1218;color:var(--ink);outline:none;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:#232b37;color:#d8cfb8;padding:8px 10px;text-align:left;font-weight:600;z-index:2}
td{padding:6px 10px;border-bottom:1px solid #232b37;color:var(--ink2)}
td:first-child{color:var(--ink);font-family:var(--serif)}
tr:hover td{background:#ffffff08}
/* ===== 弹窗 ===== */
#mask{position:fixed;inset:0;background:rgba(5,8,12,.72);display:none;z-index:100;align-items:center;justify-content:center;padding:20px}
#modal{background:#1a212b;border:1px solid #3a4656;border-radius:14px;max-width:760px;width:100%;max-height:86vh;overflow:auto;padding:26px 30px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#modal h2{font-family:var(--serif);font-size:26px;margin-bottom:2px}
#modal .meta{color:var(--ink2);font-size:13px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#modal .sec{margin-top:16px}
#modal .sec h3{font-family:var(--serif);font-size:15px;color:#d8cfb8;border-left:3px solid #c9a445;padding-left:9px;margin-bottom:7px;letter-spacing:2px}
#modal .sec .body{font-family:var(--serif);line-height:1.9;font-size:14.5px;color:#e4dcc9;white-space:pre-wrap;text-align:justify}
#modal .src{font-size:12px;color:#7d8694;margin-top:6px}
#modal .empty{color:#5f6875;font-size:13px;font-style:italic}
#mClose{float:right;background:none;border:1px solid var(--line);color:var(--ink2);border-radius:8px;width:32px;height:32px;font-size:16px;cursor:pointer}
#mClose:hover{color:var(--ink);border-color:#888}
/* 说明 */
#about{padding:26px 34px;overflow:auto;flex:1;line-height:2;font-size:14px;color:var(--ink2)}
#about h2{font-family:var(--serif);color:var(--ink);margin:14px 0 6px;font-size:19px}
#about b{color:#d8cfb8}
.foot{padding:6px 18px;font-size:11px;color:#57606e;border-top:1px solid var(--line);background:#10151c}
</style>
</head>
<body>
<header>
  <h1>三国志 · 疆域与年表<small>陈寿《三国志》及裴松之注 · 资料整理工具</small></h1>
  <div id="searchBox">
    <input id="q" type="text" placeholder="检索：人名 / 事件 / 年份（如219） / 地名（如江陵、襄阳）…" autocomplete="off">
    <div id="results"></div>
  </div>
  <div class="tabs">
    <div class="tab on" data-v="map">疆域地图</div>
    <div class="tab" data-v="tl">人物时间轴</div>
    <div class="tab" data-v="tbl">郡县总表</div>
    <div class="tab" data-v="about">凡例说明</div>
  </div>
  <div id="stats"></div>
</header>
<main>
  <section class="view on" id="v-map">
    <div id="mapWrap">
      <svg id="mapSvg"></svg>
      <svg id="ovSvg"></svg>
      <div id="tiles"></div>
      <div id="mapTip"></div>
      <div class="mapCtl">
        <select id="baseSel">
          <option value="demo">底图：示意图</option>
          <option value="amap">底图：高德街道</option>
          <option value="asat">底图：高德卫星</option>
          <option value="none">底图：无（纯点位）</option>
        </select>
        <select id="periodSel">
          <option value="c219">归属：建安二十四年（219）</option>
          <option value="c2">归属：建安五年（200）</option>
          <option value="c263">归属：景元四年（263）</option>
          <option value="none">不显示归属</option>
        </select>
        <label style="color:var(--ink2);font-size:12px;display:flex;gap:4px;align-items:center"><input type="checkbox" id="showCities" checked> 显示著名城池</label>
        <label style="color:var(--ink2);font-size:12px;display:flex;gap:4px;align-items:center"><input type="checkbox" id="showPass" checked> 显示关隘/谷道</label>
        <label style="color:var(--ink2);font-size:12px;display:flex;gap:4px;align-items:center"><input type="checkbox" id="showCounty"> 显示属县（交州56县）</label>
        <div style="display:flex;gap:6px"><button id="zin">＋</button><button id="zout">－</button><button id="zreset">复位</button></div>
      </div>
      <div id="mapPanel"></div>
      <div id="mapLegend"></div>
    </div>
  </section>
  <section class="view" id="v-tl">
    <div id="tlBar">
      <button class="btn" id="playBtn">▶ 播放 184–280</button>
      <label><input type="checkbox" id="fWei" checked><span style="color:var(--wei)">■</span> 魏</label>
      <label><input type="checkbox" id="fShu" checked><span style="color:var(--shu)">■</span> 蜀</label>
      <label><input type="checkbox" id="fWu" checked><span style="color:var(--wu)">■</span> 吴</label>
      <label><input type="checkbox" id="fQun" checked><span style="color:var(--qun)">■</span> 群雄·其他</label>
      <label><input type="checkbox" id="fFull">仅生卒齐全</label>
      <span style="flex:1"></span>
      <span style="color:var(--ink2)">跳转</span><input type="text" id="goYear" placeholder="年份"><button class="btn" id="goBtn">前往</button>
    </div>
    <div id="tlWrap">
      <div id="nameCol"><div id="nameBox"><div id="nameScroll"></div></div></div>
      <div id="tlScroll">
        <div id="tlCanvas">
          <div id="cursor"></div><div id="cursorYear"></div>
          <div id="tlLegend"></div>
        </div>
      </div>
    </div>
    <div id="playBox"><h4 id="playTitle">时间巡览</h4><div id="playList"></div></div>
  </section>
  <section class="view" id="v-tbl">
    <div id="tblWrap">
      <input id="tblQ" type="text" placeholder="筛选郡县（名称 / 治所 / 今址）…">
      <table id="tbl"><thead><tr><th>郡国</th><th>治所</th><th>今址</th><th>建安五年(200)</th><th>建安二十四年(219)</th><th>景元四年(263)</th></tr></thead><tbody></tbody></table>
    </div>
  </section>
  <section class="view" id="v-about"><div id="about"></div></section>
</main>
<div class="foot">底图为示意轮廓，非精确边界 · 生卒年阙者标「不详」，卒年存疑者附注 · 原文仅录可核实者，未敢辄补</div>
<div id="mask"><div id="modal"></div></div>

"统一北方：奉天子以令不臣，官渡破袁绍，远征乌桓；赤壁败于孙刘联军。建安十八年封魏公、二十一年进魏王。卒于洛阳，谥武。曹丕代汉后追尊魏武帝。", "e": "太祖少机警，有权数，而任侠放荡，不治行业，故世人未之奇也；惟梁国桥玄、南阳何颙异焉。玄谓太祖曰：「天下将乱，非命世之才不能济也，能安之者，其在君乎！」", "c": "汉末，天下大乱，雄豪并起，而袁绍虎摉四州，强盛莫敌。太祖运筹演谋，鞭挞宇内，揽申、商之法术，该韩、白之奇策，官方授材，各因其器，矫情任算，不念旧恶，终能总御皇机，克成洪业者，惟其明略最优也。抑可谓非常之人，超世之杰矣。", "v": "《曹瞒传》曰：太祖少好飞鹰走狗，游荡无度，其叔父数言之于嵩。太祖患之，后逢叔父于路，乃阳败面喎口；叔父怪而问其故，太祖曰：「卒中恶风。」叔父以告嵩。嵩惊愕，呼太祖，太祖口貌如故。嵩问曰：「叔父言汝中风，已差乎？」太祖曰：「初不中风，但失爱于叔父，故见罔耳。」嵩乃疑焉。自后叔父有所告，嵩终不复信，太祖于是益得肆意矣。", "m": ""}, {"n": "曹丕", "z": "子桓", "b": 187, "d": 226, "f": "魏", "p": "沛国谯县", "s": "《三国志·魏书二·文帝纪》", "g": "曹操次子。建安二十二年立为魏太子；嗣魏王，受汉禅即帝位，国号魏，都洛阳。行九品中正制，三伐吴无功。黄初七年薨，谥文。", "c": "文帝天资文藻，下笔成章，博闻强识，才艺兼该；若加之旷大之度，励以公平之诚，迈志存道，克广德心，则古之贤主，何远之有哉！", "v": "", "e": "", "m": ""}, {"n": "曹植", "z": "子建", "b": 192, "d": 232, "f": "魏", "p": "沛国谯县", "s": "《三国志·魏书十九·陈思王传》", "g": "曹操第三子，建安文学代表。丕、叡两朝屡遭贬徙，封陈思王，郁郁而终。代表作《洛神赋》《白马篇》。「七步成诗」系后世传说，不见《三国志》。", "e": "植每进见难问，应声而对，特见宠爱。建安十六年封平原侯。", "c": "任城武艺壮猛，有将领之气。陈思文才富艳，足以自通后叶，然不能克让远防，终致携隙。传曰「楚则失之矣。而齐亦未为得也」，其此之谓欤！", "v": "", "m": ""}, {"n": "曹彰", "z": "子文", "b": null, "d": 223, "f": "魏", "p": "沛国谯县", "s": "《三国志·魏书十九·任城王传》", "g": "曹操子。少善射御，膂力过人，手格猛兽；北征代郡破乌桓。封任城王，卒谥威。", "e": "任城少善射御，膂力过人，手格猛兽，不避险阻。", "c": "任城武艺壮猛，有将领之气。陈思文才富艳，足以自通后叶，然不能克让远防，终致携隙。传曰「楚则失之矣。而齐亦未为得也」，其此之谓欤！", "v": "", "m": ""}, {"n": "曹仁", "z": "子孝", "b": 168, "d": 223, "f": "魏", "p": "沛国谯县", "s": "《三国志·魏书九·曹仁传》", "g": "曹操从弟。从征四方；守江陵拒周瑜逾年，镇樊城拒关羽。曹丕时官至大司马。黄初四年薨，谥忠。", "e": "仁少时不修行检，及长为将，严整奉法令，常置科于左右，案以从事。", "c": "夏侯、曹氏，世为婚姻，故惇、渊、仁、洪、休、尚、真等并以亲旧肺腑，贵重于时，左右勋业，咸有效劳。爽德薄位尊，沈溺盈溢，此固大易所著，道家所忌也。玄以规格局度，世称其名，然与曹爽中外缱绻；荣位如斯，曾未闻匡弼其非，援致良才。举兹以论，焉能免之乎！", "v": "", "m": ""}, {"n": "曹真", "z": "子丹", "b": null, "d": 231, "f": "魏", "p": "沛国谯县", "s": "《三国志·魏书九·曹真传》", "g": "曹操养子。统虎豹骑，镇关中；督张郃破马谡于街亭。明帝时官至大将军，伐蜀遇雨还。太和五年薨，谥元。", "e": "真以亮惩于祁山，后出必从陈仓，乃使将军郝昭、王生守陈仓，治其城。", "c": "夏侯、曹氏，世为婚姻，故惇、渊、仁、洪、休、尚、真等并以亲旧肺腑，贵重于时，左右勋业，咸有效劳。爽德薄位尊，沈溺盈溢，此固大易所著，道家所忌也。玄以规格局度，世称其名，然与曹爽中外缱绻；荣位如斯，曾未闻匡弼其非，援致良才。举兹以论，焉能免之乎！", "v": "", "m": ""}, {"n": "曹爽", "z": "昭伯", "b": null, "d": 249, "f": "魏", "p": "沛国谯县", "s": "《三国 ": "", "c": "徐奕、何夔、邢颙贵尚峻厉，为世名人。毛玠清公素履，司马芝忠亮不倾，庶乎不吐刚茹柔。崔琰高格最优，鲍勋秉正无亏，而皆不免其身，惜哉！大雅贵「既明且哲」，虞书尚「直而能温」，自非兼才，畴克备诸！", "v": "", "m": ""}, {"n": "鲍信", "z": "允诚", "b": 152, "d": 192, "f": "魏", "p": "泰山平阳", "s": "《三国志·魏书十二·鲍勋传附》", "g": "济北相。迎曹操领兖州牧；击青州黄巾于寿张，力战而死，年四十一。曹丕时官其子勋。", "e": "", "c": "徐奕、何夔、邢颙贵尚峻厉，为世名人。毛玠清公素履，司马芝忠亮不倾，庶乎不吐刚茹柔。崔琰高格最优，鲍勋秉正无亏，而皆不免其身，惜哉！大雅贵「既明且哲」，虞书尚「直而能温」，自非兼才，畴克备诸！", "v": "", "m": ""}, {"n": "鲍勋", "z": "叔业", "b": null, "d": 226, "f": "魏", "p": "泰山平阳", "s": "《三国志·魏书十二·鲍勋传》", "g": "鲍信子。魏郡西部都尉、侍御史，执法不挠，连忤曹丕；文帝借故杀之。死后二十余日文帝亦崩。", "e": "", "c": "徐奕、何夔、邢颙贵尚峻厉，为世名人。毛玠清公素履，司马芝忠亮不倾，庶乎不吐刚茹柔。崔琰高格最优，鲍勋秉正无亏，而皆不免其身，惜哉！大雅贵「既明且哲」，虞书尚「直而能温」，自非兼才，畴克备诸！", "v": "", "m": ""}, {"n": "张辽", "z": "文远", "b": 169, "d": 222, "f": "魏", "p": "雁门马邑", "s": "《三国志·魏书十七·张辽传》", "g": "并州骑将，归曹操。白狼山斩蹋顿；合肥以八百破孙权十万（逍遥津），威震江表。从曹丕伐吴，病笃卒于江都。谥刚侯。", "e": "权守合肥十日，城不可拔，彻军还。兵就路，权与凌统、甘宁等在津北为魏将张辽所袭，权跨马趋津，得免。", "c": "太祖建兹武功，而时之良将，五子为先。于禁最号毅重，然弗克其终。张郃以巧变为称，乐进以骁果显名，而鉴其行事，未副所闻。或注记有遗漏，未如张辽、徐晃之备详也。", "v": "", "m": ""}, {"n": "乐进", "z": "文谦", "b": null, "d": 218, "f": "魏", "p": "阳平卫国", "s": "《三国志·魏书十七·乐进传》", "g": "以胆烈从曹操，每战先登，乌巢斩淳于琼。右将军。建安二十三年卒。谥威侯。", "e": "乐进以骁果显名。", "c": "太祖建兹武功，而时之良将，五子为先。于禁最号毅重，然弗克其终。张郃以巧变为称，乐进以骁果显名，而鉴其行事，未副所闻。或注记有遗漏，未如张辽、徐晃之备详也。", "v": "", "m": ""}, {"n": "于禁", "z": "文则", "b": null, "d": 221, "f": "魏", "p": "泰山钜平", "s": "《三国志·魏书十七·于禁传》", "g": "五子良将之一，最号毅重。建安二十四年樊城之役，汉水暴溢，七军尽没，禁降关羽；后归魏，文帝责之，惭恚发病卒。谥厉侯。", "e": "禁与其麾下万众，乘雨水盛，为羽所没。", "c": "太祖建兹武功，而时之良将，五子为先。于禁最号毅重，然弗克其终。张郃以巧变为称，乐进以骁果显名，而鉴其行事，未副所闻。或注记有遗漏，未如张辽、徐晃之备详也。", "v": "", "m": ""}, {"n": "张郃", "z": "儁乂", "b": null, "d": 231, "f": "魏", "p": "河间鄚县", "s": "《三国志·魏书十七·张郃传》", "g": "袁绍将，官渡降曹。街亭破马谡；御蜀三十年。太和五年追蜀军至木门，中飞矢卒。谥壮侯。", "e": "郃识变数，善处营陈，料战势地形，无不如计，自诸葛亮皆惮之。", "c": "太祖建兹武功，而时之良将，五子为先。于禁最号毅重，然弗克其终。张郃以巧变为称，乐进以骁果显名，而鉴其行事，未副所闻。或注记有遗漏，未如张辽、徐晃之备详也。", "v": "", "m": ""}, {"n": "徐晃", "z": "公明", "b": null, "d": 227, "f": "魏", "p": "河东杨县", "s": "《三国志·魏书十七·徐晃传》", "g": "归曹操，平吕布、袁绍。樊城长驱直入破关羽围，曹操称其「有周亚夫之风」。太和元年卒。谥壮侯。", "e": "晃扬声当攻围头屯，而密攻四冢。羽见四冢欲坏，自将步骑五千出战，晃击之， ）", "g": "河内司马氏。建安中为曹操文学掾、主簿，渐掌军机。南拒孙权、西抗诸葛亮（祁山、五丈原之役皆当其锋）；太和二年督军斩孟达，景初二年远征平辽东公孙渊。正始十年（249）发动高平陵之变，诛曹爽，专魏政；嘉平三年又平王凌淮南之叛。是年八月卒于洛阳，遗二子师、昭善理国政。咸熙元年追晋王，谥宣，其孙炎受禅后追尊宣皇帝，庙号高祖。", "e": "帝少有奇节，聪明多大略，博学洽闻，伏膺儒教。汉末大乱，常慨然有忧天下心。（《宣帝纪》开篇）\n又载：魏武察帝有雄豪志，闻有狼顾相，欲验之，乃召使前行，令反顾，面正向后而身不动。尝梦三马同食一槽，甚恶焉。（「三马同槽」典出此）", "c": "", "v": "", "t": "扩展收录：原文据《晋书·宣帝纪》。《三国志》未立传，故无陈寿评；裴松之注系《三国志》所独有，《晋书》无之。《宣帝纪》史臣论及唐太宗御撰纪论文长，此处从略。", "m": ""}, {"n": "司马师", "z": "子元", "b": 208, "d": 255, "f": "魏", "p": "河内温县", "s": "《晋书·卷二·景帝纪》", "g": "懿长子。嘉平元年袭舞阳侯，抚军大将军、录尚书事。嘉平六年（254）废曹芳为齐王，立高贵乡公曹髦；正元元年（255）统军平毌丘俭、文钦淮南之叛，目瘤疾作，卒于许昌归途军中，年四十八。追尊景皇帝，庙号世宗。", "e": "景皇帝讳师，字子元，宣帝之长子也。少有风彩，沈毅多大略。少流美誉，与夏侯玄、何晏齐名。（《景帝纪》开篇）\n又载：宣帝之将诛曹爽，深谋秘策，独与帝潜画，文帝弗之知也。将发夕乃告之，既而使人觇之，帝寝如常，而文帝不能安席。晨会兵司马门，镇静内外，置阵甚整。", "c": "", "v": "", "t": "扩展收录：原文据《晋书·景帝纪》。无陈寿评、裴松之注（二人皆不及见《晋书》）。", "m": ""}, {"n": "司马昭", "z": "子上", "b": 211, "d": 265, "f": "魏", "p": "河内温县", "s": "《晋书·卷二·文帝纪》", "g": "师母弟。正元二年嗣大将军，专国政。甘露五年（260）高贵乡公曹髦讨之，为太子舍人成济所弑，昭归罪成济、诛其三族以谢天下，迎立陈留王曹奂。景元四年（263）遣钟会、邓艾灭蜀，进位晋公、晋王，加九锡、设天子旌旗。咸熙二年（265）卒，年五十五。数月后其子炎受禅建晋，追尊文皇帝，庙号太祖。", "e": "文皇帝讳昭，字子上，景帝之母弟也。幼有硕量，聪明多大略。（《文帝纪》开篇）\n又载高贵乡公之弑：五月己丑，高贵乡公卒，年二十。太后令曰：「此儿之行，出自秉意……」", "c": "", "v": "", "t": "扩展收录：原文据《晋书·文帝纪》。无陈寿评、裴松之注。曹髦之死，《魏书·三少帝纪》载「卒」，《晋书》始明言其讨昭遇害，两书书法不同，读者宜知。", "m": ""}, {"n": "司马孚", "z": "叔达", "b": 180, "d": 272, "f": "魏", "p": "河内温县", "s": "《晋书·安平献王孚传》", "g": "司马懿弟，历魏五世。曹髦被弑，枕尸痛哭。入晋封安平王，泰始八年薨，年九十三。", "e": "", "c": "", "v": "", "m": ""}, {"n": "司马朗", "z": "伯达", "b": 171, "d": 217, "f": "魏", "p": "河内温县", "s": "《三国志·魏书十五·司马朗传》", "g": "懿兄。兖州刺史，治绩宽惠。建安二十二年征吴，督运遇疫疾，亲视医药，遇疾卒，时年四十七。", "e": "", "c": "自汉季以来，刺史总统诸郡，赋政于外，非若曩时司察之而已。太祖创基，迄终魏业，此皆其流称誉有名实者也。咸精达事机，威恩兼著，故能肃齐万里，见述于后也。", "v": "", "m": ""}, {"n": "杜畿", "z": "伯侯", "b": 163, "d": 224, "f": "魏", "p": "京兆杜陵", "s": "《三国志·魏书十六·杜畿传》", "g": "守河东十六年，课农兴学。魏初为尚书仆射；试御楼船于孟津，船没溺卒，年六十二。谥戴侯。", "e": "", "c": "任峻始兴义兵，以归太祖，辟土殖谷，仓庾盈溢，庸绩致矣。苏则威以平乱，既政事之良，又矫矫刚直，风烈足称。杜畿宽猛克济，惠以康民。郑浑、仓慈，恤理有方。抑皆魏代之名守乎！恕屡陈时政，经论治体，盖有可观焉。", "v": "", "m": ""}, {"n": "贾逵", "z": "梁道", "b": 174, "d": 228, "f": 感激，遂许先帝以驱驰。（《出师表》）", "c": "诸葛亮之为相国也，抚百姓，示仪轨，约官职，从权制，开诚心，布公道；尽忠益时者虽仇必赏，犯法怠慢者虽亲必罚，服罪输情者虽重必释，游辞巧饰者虽轻必戮；善无微而不赏，恶无纤而不贬；庶事精练，物理其本，循名责实，虚伪不齿；终于邦域之内，咸畏而爱之，刑政虽峻而无怨者，以其用心平而劝戒明也。可谓识治之良才，管、萧之亚匹矣。然连年动众，未能成功，盖应变将略，非其所长欤！", "v": "《襄阳记》曰：亮初亡，所在各求为立庙，朝议以礼秩不听，百姓遂因时节私祭之于道陌上。言事者或以为可听立庙于成都者，后主不从。步兵校尉习隆、中书郎向充等共上表曰：「臣闻周人怀召伯之德，甘棠为之不伐；越王思范蠡之功，铸金以存其像……今若尽顺民心，则渎而无典，建之京师，又逼宗庙，此圣怀所以惟疑也。臣愚以为宜因近其墓，立之于沔阳……断其私祀，以崇正礼。」于是始从之。", "m": "亮少有逸群之才，英霸之器，身长八尺，容貌甚伟，时人异焉。"}, {"n": "诸葛瞻", "z": "思远", "b": 227, "d": 263, "f": "蜀", "p": "琅邪阳都", "s": "《三国志·蜀书五·诸葛亮传附》", "g": "亮子，尚公主。邓艾伐蜀，与长子尚督军拒于绵竹，临阵战死。", "e": "", "c": "", "v": "", "m": ""}, {"n": "关羽", "z": "云长", "b": null, "d": 220, "f": "蜀", "p": "河东解县", "s": "《三国志·蜀书六·关羽传》", "g": "刘备义弟（恩若兄弟）。白马斩颜良报曹；镇守荆州十年，北伐樊城，水淹七军，威震华夏；吕蒙袭江陵，败走麦城，与子平同被擒杀。", "e": "羽望见良麾盖，策马刺良于万众之中，斩其首还，绍诸将莫能当者，遂解白马围。", "c": "关羽、张飞皆称万人之敌，为世虎臣。羽报效曹公，飞义释严颜，并有国士之风。然羽刚而自矜，飞暴而无恩，以短取败，理数之常也。马超阻戎负勇，以覆其族，惜哉！能因穷致泰，不犹愈乎！黄忠、赵云强挚壮猛，并作爪牙，其灌、滕之徒欤？", "v": "《蜀记》曰：曹公遣张辽问羽，羽叹曰：「吾极知曹公待我厚，然吾受刘将军厚恩，誓以共死，不可背之。吾终不留，吾要当立效以报曹公乃去。」辽以羽言报曹公，曹公义之。", "t": "卒于建安二十四年十二月，公历已入220年", "m": "羽美须髯，故亮谓之髯。羽省书大悦，以示宾客。"}, {"n": "张飞", "z": "益德", "b": null, "d": 221, "f": "蜀", "p": "涿郡", "s": "《三国志·蜀书六·张飞传》", "g": "刘备义弟。当阳据水断桥，瞋目横矛退曹骑；义释严颜；巴西破张郃。伐吴前夕，为部下范强、张达所害。", "e": "飞据水断桥，瞋目横矛曰：「身是张益德也，可来共决死！」敌皆无敢近者，故遂得免。", "c": "关羽、张飞皆称万人之敌，为世虎臣。羽报效曹公，飞义释严颜，并有国士之风。然羽刚而自矜，飞暴而无恩，以短取败，理数之常也。马超阻戎负勇，以覆其族，惜哉！能因穷致泰，不犹愈乎！黄忠、赵云强挚壮猛，并作爪牙，其灌、滕之徒欤？", "v": "", "m": ""}, {"n": "赵云", "z": "子龙", "b": null, "d": 229, "f": "蜀", "p": "常山真定", "s": "《三国志·蜀书六·赵云传》", "g": "从刘备于微时。长坂单骑救后主及甘夫人；入蜀从征；箕谷敛众不亏。建兴七年卒，谥顺平侯。", "e": "云身抱弱子，即后主也，保护甘夫人，即后主母也，皆得免难。", "c": "关羽、张飞皆称万人之敌，为世虎臣。羽报效曹公，飞义释严颜，并有国士之风。然羽刚而自矜，飞暴而无恩，以短取败，理数之常也。马超阻戎负勇，以覆其族，惜哉！能因穷致泰，不犹愈乎！黄忠、赵云强挚壮猛，并作爪牙，其灌、滕之徒欤？", "v": "《云别传》曰：益州既定，时议欲以成都中屋舍及城外园地桑田分赐诸将。云驳之曰：「霍去病以匈奴未灭，无用家为，今国贼非但匈奴，未可求安也。须天下都定，各反桑梓，归耕本土，乃其宜耳……」先主即从之。", "m": "云身长八尺，姿颜雄伟，为本郡所举，将义从吏兵诣公孙瓒。（裴注《云别传》）"}, {"n": "马超", "z": "孟起", "b": 176, "d": 222, "f": "蜀", "p": "扶风茂陵", "s": "《三国志·蜀书六·马超传》", "g": "锦马超。关中起兵拒曹，渭南败；投张鲁，归刘备，迫降成都。章武二年卒，年四十七。谥威侯。", "e": "", "c": "关羽 数之常也。马超阻戎负勇，以覆其族，惜哉！能因穷致泰，不犹愈乎！黄忠、赵云强挚壮猛，并作爪牙，其灌、滕之徒欤？", "v": "", "m": ""}, {"n": "霍弋", "z": "绍先", "b": null, "d": null, "f": "蜀", "p": "南郡枝江", "s": "《三国志·蜀书十三》附", "g": "霍峻子。安南将军镇南中；蜀亡，坚守后降晋。卒年不详。", "e": "", "c": "霍峻孤城不倾，王连固节不移，向朗好学不倦，张裔肤敏应极，杨洪乃心忠公，费诗率意而言，皆有可纪焉。以先主之广济，诸葛之准绳，诗吐直言，犹用凌迟，况庸后乎哉！", "v": "", "m": ""}, {"n": "罗宪", "z": "令则", "b": null, "d": null, "f": "蜀", "p": "襄阳", "s": "《三国志》裴注引《襄阳记》", "g": "守永安，蜀亡拒吴；入晋巴东太守。卒年不详。", "e": "", "c": "", "v": "", "m": ""}, {"n": "孙坚", "z": "文台", "b": 155, "d": 192, "f": "吴", "p": "吴郡富春", "s": "《三国志·吴书一·孙坚传》", "g": "吴郡富春人，以勇烈起。讨董卓，阳人之战破卓军，斩都督华雄。初平三年攻襄阳刘表，单马巡岘山，为黄祖军士射杀。", "e": "坚复相收兵，合战于阳人，大破卓军，枭其都督华雄等。", "c": "孙坚勇挚刚毅，孤微发迹，导温戮卓，山陵杜塞，有忠壮之烈。策英气杰济，猛锐冠世，览奇取异，志陵中夏。然皆轻佻果躁，陨身致败。且割据江东，策之基兆也。", "v": "", "t": "卒于初平三年（192）", "m": "坚容貌不凡，性阔达好奇节，父老皆异之。"}, {"n": "孙策", "z": "伯符", "b": 175, "d": 200, "f": "吴", "p": "吴郡富春", "s": "《三国志·吴书一·孙策传》", "g": "孙坚长子。以父旧部千余渡江，数年间定江东，号小霸王。建安五年猎于丹徒，为许贡门客所伤，卒，年二十六。", "e": "策为人，美姿颜，好笑语，性阔达听受，善于用人。是以士民见者，莫不尽心，乐为致死。", "c": "孙坚勇挚刚毅，孤微发迹……策英气杰济，猛锐冠世，览奇取异，志陵中夏。然皆轻佻果躁，陨身致败。且割据江东，策之基兆也。", "v": "", "m": "策为人，美姿颜，好笑语，性阔达听受，善于用人。"}, {"n": "孙权", "z": "仲谋", "b": 182, "d": 252, "f": "吴", "p": "吴郡富春", "s": "《三国志·吴书二·吴主传》", "g": "十五岁继领江东。赤壁破曹，荆州杀关羽、夷陵败刘备，联曹抗刘因势而变。黄龙元年称帝，国号吴。晚年多忌杀戮，立嗣不定。太元元年薨，年七十一，谥大皇帝。", "e": "权生，方颐大口，目有精光，坚异之，以为有贵象。", "c": "孙权屈身忍辱，任才尚计，有勾践之奇，英人之杰矣。故能自擅江表，成鼎峙之业。然性多嫌忌，果于杀戮，暨臻末年，弥以滋甚。至于谗说殄行，胤嗣废毙，岂所谓贻厥孙谋以燕翼子者哉？其后叶陵迟，遂致覆国，未必不由此也。", "v": "《魏略》曰：权乘大船来观军，公使弓弩乱发，箭著其船，船偏重将覆，权因回船，复以一面受箭，箭均船平，乃还。", "m": "权生，方颐大口，目有精光，坚异之，以为有贵象。"}, {"n": "孙亮", "z": "子明", "b": 243, "d": 260, "f": "吴", "p": "吴郡富春", "s": "《三国志·吴书三·三嗣主传》", "g": "权少子，十岁嗣位。诸葛恪、孙峻、孙綝相继专政；太平三年被废为会稽王，后自杀（一说被鸩）。", "e": "", "c": "孙亮童孺而无贤辅，其替位不终，必然之势也。休以旧爱宿恩，任用兴、布，不能拔进良才，改弦易张，虽志善好学，何益救乱乎？又使既废之亮不得其死，友于之义薄矣。皓之淫刑所滥，陨毙流黜者，盖不可胜数。是以群下人人惴恐，皆日日以冀，朝不谋夕。其荧惑、巫祝，交致祥瑞，以为至急。昔舜、禹躬稼，至圣之德，犹或矢誓众臣，予违女弼，或拜昌言，常若不及。况皓凶顽，肆行残暴，忠谏者诛，谗谀者进，虐用其民，穷淫极侈，宜腰首分离，以谢百姓。既蒙不死之诏，复加归命之宠，岂非旷荡之恩，过厚之泽也哉！", "v": "", "m": ""}, {"n": "孙休", "z": "子烈", "b": 235, "d": 264, "f": "吴", "p": "吴郡富春", "s": "《三国志·吴书三·三 "p": "会稽山阴", "s": "《三国志·吴书八·阚泽传》", "g": "历算名家，为太子太傅；以儒学显。卒年不详。", "e": "", "c": "张纮文理意正，为世令器，孙策待之亚于张昭，诚有以也，严、程、阚生，一时儒林也。至畯辞荣济旧，不亦长者乎！薛综学识规纳，为吴良臣。及莹纂蹈，允有先风，然于暴酷之朝，屡登显列，君子殆诸。", "v": "", "m": ""}, {"n": "薛综", "z": "敬文", "b": null, "d": null, "f": "吴", "p": "沛郡竹邑", "s": "《三国志·吴书八·薛综传》", "g": "名儒，太子少傅？著诗赋难论数万言。卒年不详。", "e": "", "c": "张纮文理意正，为世令器，孙策待之亚于张昭，诚有以也，严、程、阚生，一时儒林也。至畯辞荣济旧，不亦长者乎！薛综学识规纳，为吴良臣。及莹纂蹈，允有先风，然于暴酷之朝，屡登显列，君子殆诸。", "v": "", "m": ""}, {"n": "周瑜", "z": "公瑾", "b": 175, "d": 210, "f": "吴", "p": "庐江舒县", "s": "《三国志·吴书九·周瑜传》", "g": "与孙策同年友善，建独断之明。赤壁火攻破曹，取南郡。建安十五年卒于巴丘，年三十六。", "e": "时曹公军众已有疾病，初一交战，公军败退，引次江北。瑜等在南岸。瑜部将黄盖曰：「今寇众我寡，难与持久。然观操军船舰首尾相接，可烧而走也。」乃取蒙冲斗舰数十艘，实以薪草，膏油灌其中，裹以帷幕，上建牙旗，先书报曹公，欺以欲降。又豫备走舸，各系大船后，因引次俱前。", "c": "曹公乘汉相之资，挟天子而扫群桀，新荡荆城，仗威东夏，于时议者莫不疑贰。周瑜、鲁肃建独断之明出众人之表，实奇才也。吕蒙勇而有谋，断识军计，谲郝普，禽关羽，最其妙者。初虽轻果妄杀，终于克己，有国士之量，岂徒武将而已乎！孙权之论，优劣允当，故载录焉。", "v": "《江表传》曰：普颇以年长数陵侮瑜，瑜折节容下，终不与校。普后自敬服而亲重之，乃告人曰：「与周公瑾交，若饮醇醪，不觉自醉。」", "m": "瑜长壮有姿貌。精音律，时有阙误，瑜必知之，知之必顾，故时人谣曰：「曲有误，周郎顾。」"}, {"n": "鲁肃", "z": "子敬", "b": 172, "d": 217, "f": "吴", "p": "临淮东城", "s": "《三国志·吴书九·鲁肃传》", "g": "周瑜荐于孙权，陈榻上之策。赤壁主和？力主联刘抗曹；单刀会？后肃与羽？建安二十二年卒，年四十六。", "e": "肃对曰：「……汉室不可复兴，曹操不可卒除。为将军计，惟有鼎足江东，以观天下之衅。规模如此，亦自无嫌。何者？北方诚多务也。因其多务，剿除黄祖，进伐刘表，竟长江所极，据而有之，然后建号帝王以图天下，此高帝之业也。」", "c": "曹公乘汉相之资，挟天子而扫群桀，新荡荆城，仗威东夏，于时议者莫不疑贰。周瑜、鲁肃建独断之明出众人之表，实奇才也。吕蒙勇而有谋，断识军计，谲郝普，禽关羽，最其妙者。初虽轻果妄杀，终于克己，有国士之量，岂徒武将而已乎！孙权之论，优劣允当，故载录焉。", "v": "《吴书》曰：肃体貌魁奇，少有壮节，好为奇计。天下将乱，乃学击剑骑射，招聚少年，给其衣食，往来南山中射猎，阴相部勒，讲武习兵。", "m": ""}, {"n": "吕蒙", "z": "子明", "b": 178, "d": 220, "f": "吴", "p": "汝南富陂", "s": "《三国志·吴书九·吕蒙传》", "g": "少渡江依姊夫邓当。定计取荆州，白衣渡江袭关羽。封南郡太守、孱陵侯。建安二十四年卒，年四十二。", "e": "权谓蒙曰：「卿今当涂掌事，不可不学！」蒙辞以军中多务。权曰：「孤岂欲卿治经为博士邪！但当令涉猎见往事耳。卿言多务，孰若孤？孤少时历《诗》《书》《礼记》《左传》《国语》，惟不读《易》。至统事以来，省三史、诸家兵书，自以为大有所益。如卿二人，意性朗悟，学必得之，宁当不为乎？宜急读《孙子》《六韬》《左传》《国语》及三史。」", "c": "曹公乘汉相之资，挟天子而扫群桀，新荡荆城，仗威东夏，于时议者莫不疑贰。周瑜、鲁肃建独断之明出众人之表，实奇才也。吕蒙勇而有谋，断识军计，谲郝普，禽关羽，最其妙者。初虽轻果妄杀，终于克己，有国士之量，岂徒武将而已乎！孙权之论，优劣允当，故载录焉。", "v": "《江表传》载权劝学语及鲁肃「非复吴下阿蒙」之叹，即「士别三日，即更刮目相待」所本。", "m": ""}, {"n": "程普", "z": "德谋", "b": null, "d": null, "f": "吴", "p": ": "曹操·袁绍", "pl": "白马、延津", "d": "关羽斩颜良于白马；延津之战文丑授首。", "s": "《三国志·武帝纪》《关羽传》"}, {"y": 200, "n": "官渡之战", "t": "war", "f": "曹操·袁绍", "pl": "官渡", "d": "相持数月，许攸来投，曹操烧乌巢粮，绍军大溃。", "s": "《三国志·武帝纪》"}, {"y": 200, "n": "孙策遇刺", "t": "oth", "f": "孙策", "pl": "丹徒", "d": "策猎为许贡门客所创，旋卒，年二十六。", "s": "《三国志·孙策传》"}, {"y": 202, "n": "博望坡之战", "t": "war", "f": "刘备·夏侯惇", "pl": "博望", "d": "备烧屯伪遁，破惇于博望。", "s": "《三国志·先主传》"}, {"y": 202, "n": "袁绍病卒", "t": "oth", "f": "袁绍", "pl": "邺", "d": "官渡败后忧愤，建安七年呕血死。", "s": "《三国志·袁绍传》"}, {"y": 203, "n": "袁谭袁尚相攻", "t": "war", "f": "袁谭·袁尚", "pl": "邺", "d": "兄弟争嗣，谭攻尚于邺，不克；曹操乘乱而进。", "s": "《三国志·袁绍传附》"}, {"y": 204, "n": "曹操围邺", "t": "war", "f": "曹操", "pl": "邺", "d": "决漳水灌邺，审配固守；八月城破，配面北而死。", "s": "《三国志·武帝纪》"}, {"y": 205, "n": "南皮之战·斩袁谭", "t": "war", "f": "曹操", "pl": "南皮", "d": "曹操急攻南皮，谭败走被斩，冀州平。", "s": "《三国志·武帝纪》"}, {"y": 206, "n": "壶关之战·并州平", "t": "war", "f": "曹操", "pl": "壶关", "d": "围壶关，高干奔匈奴被杀，并州定。", "s": "《三国志·武帝纪》"}, {"y": 207, "n": "白狼山之战", "t": "war", "f": "曹操", "pl": "柳城白狼山", "d": "千里奔袭，张辽先锋阵斩蹋顿，胡汉二十万众降。", "s": "《三国志·武帝纪》《张辽传》"}, {"y": 207, "n": "三顾茅庐", "t": "dip", "f": "刘备", "pl": "隆中", "d": "刘备三访诸葛亮，亮陈《隆中对》。", "s": "《三国志·诸葛亮传》"}, {"y": 208, "n": "曹操自为丞相", "t": "pol", "f": "曹操", "pl": "许县", "d": "复置丞相，曹操自为之。", "s": "《三国志·武帝纪》"}, {"y": 208, "n": "刘表卒·刘琮降", "t": "pol", "f": "刘琮", "pl": "襄阳", "d": "刘表病卒，琮立；曹操军至新野，琮举州降。", "s": "《三国志·刘表传》"}, {"y": 208, "n": "长坂之战", "t": "war", "f": "曹操·刘备", "pl": "当阳长坂", "d": "曹精骑一日一夜追及，备弃妻子走，赵云救后主。", "s": "《三国志·先主传》《赵云传》"}, {"y": 208, "n": "赤壁之战", "t": "war", "f": "孙刘联军·曹操", "pl": "赤壁", "d": "黄盖火攻，曹军船舰尽焚，北军败归；三分之势始奠。", "s": "《三国志·武帝纪》《周瑜传》"}, {"y": 208, "n": "孙权围合肥", "t": "war", "f": "孙权", "pl": "合肥", "d": "孙权乘赤壁之胜攻合肥，月余不拔，退。", "s": "《三国志·吴主传》"}, {"y": 209, "n": "周瑜取南郡", "t": "war", "f": "周瑜·曹仁", "pl": "江陵", "d": "岁余攻防，曹仁弃江陵走，孙权以瑜为南郡太守。", "s": "《三国志·周瑜传》"}, {"y": 209, "n": "孙刘联姻", "t": "dip", "f": "孙权·刘备", "pl": "京口", "d": "权以妹妻备，加固联盟（《三国志》未明纪年，或作210）。", "s": "《三国志·先主传》"}, {"y": 210, "n": "周瑜卒", "t": "oth", "f": "周瑜", "pl": "巴丘", "d": "瑜还江陵治行，道病卒于巴丘，年三十六。", "s": "《三国志·周瑜传》"}, {"y": 210, "n": "步骘定交州", "t": "pol", "f": "步骘", "pl": "交州", "d": "步骘为交州刺史，斩吴巨，士燮兄弟归附。", "s": "《三国志·士燮传》"}, {"y": 211, "n": "潼关之战", "t": "war", "f": "曹操·马超韩遂", "pl": "潼关", "d": "曹操用贾诩离间计，大破关中十部联军。", "s": "《三国志·武帝纪》"}, {"y": 211, "n": "刘备入蜀", "t": "pol", "f": "刘备", "pl": "成都", "d": "刘璋遣法正迎备，备率众入蜀至葭萌。", "s": "《三国志·先主传》"}, {"y": 212, "n": "刘备攻刘璋", "t": "war", "f": "刘备·刘璋", "pl": "涪城", "d": "备与璋决裂，据涪城，进围雒城。", "s": "《三国志·先主传》"}, {"y": 213, "n": "曹操称魏公", "t": "pol", "f": "曹操", "pl": "邺", "d": "献帝册曹操为魏公，加九锡，建魏国社稷。", "s": "《三国志·武帝纪》"}, {"y": 213, "n": "濡须之战", "t": "war", "f": "曹操·孙权", "pl": "濡须", "d": "曹操攻濡须坞，相持月余，权以舟师逼观军，操叹「生子当如孙仲谋」。", "s": "《三国志·吴主传》"}, {"y": 214, "n": "雒城之战·庞统卒", "t": "war", "f": "刘备·刘璋", "pl": "雒城", "d": "备围雒城一年，庞统督众攻城中流矢卒，年三十六。", "s": "《三国志·庞统传》"}, {"y": 214, "n": "刘备取成都·刘璋降", "t": "war", "f": "刘备", "pl": "成都", "d": "马超至，围城数十日，刘璋开城出降，益州定。", "s": "《三国志·先主传》"}, {"y": 214, "n": "伏皇后案", "t": "pol", "f": "曹操", "pl": "许县", "d": "伏皇后密诏事发，后被幽死，皇子酖杀，灭族。", "s": "《三国志·武帝纪》"}, {"y": 215, "n": "曹操平汉中", "t": "war", "f": "曹操·张鲁", "pl": "汉中", "d": "曹军入武都，张鲁奔南山后降，操封鲁阆中侯。", "s": "《三国志·武帝纪》"}, {"y": 215, "n": "合肥之战（逍遥津）", "t": "war", "f": "张辽·孙权", "pl": "合肥", "d": "辽以八百破十万，权几不免，江南小儿夜啼，怖之以辽。", "s": "《三国志·张辽传》"}, {"y": 215, "n": "湘水之盟", "t": "dip", "f": "孙权·刘备", "pl": "湘江", "d": "权索荆州三郡，备至公安；以湘水为界，各罢兵。", "s": "《三国志·吴主传》"}, {"y": 216, "n": "曹操进魏王", "t": "pol", "f": "曹操", "pl": "邺", "d": "献帝册进魏王，设天子旌旗，礼绝百僚。", "s": "《三国志·武帝纪》"}, {"y": 217, "n": "鲁肃卒", "t": "oth", "f": "鲁肃", "pl": "巴丘", "d": "肃年四十六卒，权举哀，吕蒙代镇陆口。", "s": "《三国志·鲁肃传》"}, {"y": 217, "n": "汉中之战·阳平关", "t": "war", "f": "刘备·曹操", "pl": "阳平关", "d": "备进兵汉中，与曹军相持于阳平关。", "s": "《三国志·先主传》"}, {"y": 218, "n": "曹彰破代郡乌桓", "t": "war", "f": "曹彰", "pl": "代郡", "d": "彰北征，身搏战，大破乌桓，鲜卑请服。", "s": "《三国志·任城王传》"}, {"y": 219, "n": "定军山之战", "t": "war", "f": "刘备·夏侯渊", "pl": "定军山", "d": "老将黄忠推锋斩渊，曹军大败，操弃汉中。", "s": "《三国志·黄忠传》"}, {"y": 219, "n": "刘备称汉中王", "t": "pol", "f": "刘备", "pl": "沔阳", "d": "备表封汉中王，还治成都；以魏延镇汉中。", "s": "《三国志·先主传》"}, {"y": 219, "n": "樊城之战·水淹七军", "t": "war", "f": "关羽·于禁庞德", "pl": "樊城", "d": "汉水暴溢，七军尽没，禁降、德死，羽威震华夏，许都以南响应。", "s": "《三国志·关羽传》"}, {"y": 219, "n": "吕蒙袭江陵", "t": "war", "f": "吕蒙·关羽", "pl": "江陵", "d": "蒙白衣渡江，公安、江陵守将傅士仁、麋芳皆降。", "s": "《三国志·吕蒙传》"}, {"y": 220, "n": "关羽败亡", "t": "war", "f": "孙权·关羽", "pl": "麦城·临沮", "d": "羽西保麦城，突围西走，为潘璋司马马忠所获，与子平俱死。", "s": "《三国志·关羽传》"}, {"y": 220, "n": "孟达降魏·失上庸", "t": "pol", "f": "孟达", "pl": "上庸", "d": "达惧罪，率郡降魏，魏合东三郡为新城郡。", "s": "《三国志·刘封传》"}, {"y": 220, "n": "曹操薨·曹丕嗣位", "t": "pol", "f": "曹丕", "pl": "洛阳", "d": "魏王曹操卒于洛阳，世子丕嗣为丞相、魏王。", "s": "《三国志·武帝纪》"}, {"y": 220, "n": "曹丕代汉·魏立", "t": "pol", "f": "曹丕", "pl": "许昌→洛阳", "d": "献帝禅位，魏立，改元黄初；东汉亡。", "s": "《三国志·文帝纪》"}, {"y": 221, "n": "刘备称帝·蜀汉立", "t": "pol", "f": "刘备", "pl": "成都", "d": "备即皇帝位，国号汉，建元章武；以诸葛亮为丞相。", "s": "《三国志·先主传》"}, {"y": 221, "n": "张飞遇害", "t": "oth", "f": "张飞", "pl": "阆中", "d": "飞帐下范强、张达杀飞，持其首奔吴。", "s": "《三国志·张飞传》"}, {"y": 221, "n": "刘备伐吴", "t": "war", "f": "刘备·孙权", "pl": "巫峡", "d": "备亲率诸军东征，破吴将李异、刘阿于巫、秭归。", "s": "《三国志·先主传》"}, {"y": 222, "n": "夷陵之战（猇亭）", "t": "war", "f": "陆逊·刘备", "pl": "猇亭", "d": "逊坚壁不战七八月，火攻连营，破备四十余营，备仅以身免。", "s": "《三国志·陆逊传》"}, {"y": 222, "n": "刘备退守白帝城", "t": "war", "f": "刘备", "pl": "永安", "d": "备收败兵还鱼复，改永安，吴将徐盛等请追，逊止之。", "s": "《三国志·陆逊传》"}, {"y": 222, "n": "曹丕三路伐吴", "t": "war", "f": "曹丕·孙权", "pl": "洞口·江陵", "d": "魏三路攻吴，曹休破吕范于洞口，张辽等至江陵；疫疾作，诸军退。", "s": "《三国志·吴主传》"}, {"y": 223, "n": "刘备崩于白帝城", "t": "pol", "f": "刘禅", "pl": "永安", "d": "先主殂于永安宫，托孤诸葛亮、李严，后主禅位。", "s": "《三国志·先主传》"}, {"y": 223, "n": "南中叛乱", "t": "oth", "f": "雍闿", "pl": "益州郡", "d": "雍闿杀建宁太守正昂，执太守张裔送吴，牂柯、越巂皆叛。", "s": "《三国志·诸葛亮传》"}, {"y": 224, "n": "曹丕伐吴", "t": "war", "f": "曹丕", "pl": "广陵", "d": "文帝幸广陵，临江观兵，见吴严守，叹「天所以限南北」，退。", "s": "《三国志·文帝纪》"}, {"y": 225, "n": "诸葛亮南征", "t": "war", "f": "诸葛亮·孟获", "pl": "南中", "d": "亮五月渡泸，七纵七禽孟获，南中四郡皆平。", "s": "《三国志·诸葛亮传》"}, {"y": 225, "n": "曹丕再伐广陵", "t": "war", "f": "曹丕", "pl": "广陵", "d": "复临江，冰凌船不得入，焚舟而退。", "s": "《三国志·文帝纪》"}, {"y": 226, "n": "曹丕崩·曹叡立", "t": "pol", "f": "曹叡", "pl": "洛阳", "d": "文帝崩于嘉福殿，明帝即位，司马懿、曹真等辅政。", "s": "《三国志·明帝纪》"}, {"y": 227, "n": "诸葛亮上《出师表》", "t": "pol", "f": "诸葛亮", "pl": "汉中", "d": "建兴五年，亮率诸军北驻汉中，表请出师。", "s": "《三国志·诸葛亮传》"}, {"y": 228, "n": "司马懿破孟达", "t": "war", "f": "司马懿·孟达", "pl": "新城", "d": "达反覆，懿倍道攻新城，旬月拔之，斩达。", "s": "《三国志·明帝纪》"}, {"y": 228, "n": "街亭之败", "t": "war", "f": "张郃·马谡", "pl": "街亭", "d": "亮一出祁山，三郡响应；谡违节度，大败于街亭，亮还。", "s": "《三国志·诸葛亮传》"}, {"y": 228, "n": "石亭之战", "t": "war", "f": "陆逊·曹休", "pl": "石亭", "d": "周鲂断发诈降诱休，逊破休于石亭，休惭恚卒。", "s": "《三国志·陆逊传》"}, {"y": 229, "n": "孙权称帝·吴立", "t": "pol", "f": "孙权", "pl": "武昌", "d": "权即皇帝位于武昌，国号吴，旋迁都建业。", "s": "《三国志·吴主传》"}, {"y": 229, "n": "诸葛亮取武都阴平", "t": "war", "f": "诸葛亮", "pl": "武都·阴平", "d": "三出祁山，拔武都、阴平二郡，还师。", "s": "《三国志·诸葛亮传》"}, {"y": 230, "n": "曹真伐蜀", "t": "war", "f": "曹真", "pl": "斜谷", "d": "真以数道伐蜀，会大霖雨三十余日，栈道绝，诏班师。", "s": "《三国志·曹真传》"}, {"y": 230, "n": "卫温浮海求夷洲", "t": "oth", "f": "卫温·诸葛直", "pl": "夷洲", "d": "遣将军卫温、诸葛直浮海求夷洲、亶洲，得夷洲数千人而还。", "s": "《三国志·吴主传》"}, {"y": 231, "n": "木门道之战", "t": "war", "f": "诸葛亮·张郃", "pl": "祁山·木门", "d": "四出祁山，司马懿令郃追，至木门，与亮军战，飞矢中郃右膝卒。", "s": "《三国志·张郃传》"}, {"y": 234, "n": "诸葛亮五出祁山", "t": "war", "f": "诸葛亮·司马懿", "pl": "五丈原", "d": "亮出斜谷，据武功五丈原，与懿相持百余日，分兵屯田。", "s": "《三国志·诸葛亮传》"}, {"y": 234, "n": "诸葛亮卒于五丈原", "t": "oth", "f": "诸葛亮", "pl": "五丈原", "d": "亮疾病，卒于军中，年五十四；长史杨仪整军而退。", "s": "《三国志·诸葛亮传》"}, {"y": 234, "n": "魏延之乱", "t": "war", "f": "魏延·杨仪", "pl": "褒斜道", "d": "延烧绝栈道，与仪各表相叛；延败走，为马岱所斩。", "s": "《三国志·魏延传》"}, {"y": 237, "n": "公孙渊称燕王", "t": "pol", "f": "公孙渊", "pl": "襄平", "d": "渊自立为燕王，置百官，连结鲜卑。", "s": "《三国志·公孙渊传》"}, {"y": 238, "n": "司马懿平辽东", "t": "war", "f": "司马懿·公孙渊", "pl": "襄平", "d": "懿围襄平，流星坠城中，粮尽人相食，城破渊死。", "s": "《三国志·公孙渊传》"}, {"y": 239, "n": "曹叡崩·曹芳立", "t": "pol", "f": "曹芳", "pl": "洛阳", "d": "明帝崩，八岁曹芳立，曹爽、司马懿辅政。", "s": "《三国志·明帝纪》"}, {"y": 241, "n": "吴攻芍陂", "t": "war", "f": "全琮·司马昭", "pl": "芍陂", "d": "琮略淮南，决芍陂；昭督诸军破之。", "s": "《三国志·吴主传》"}, {"y": 244, "n": "曹爽伐蜀·兴势之败", "t": "war", "f": "曹爽·王平", "pl": "兴势", "d": "爽发十余万众入骆谷，王平据兴势拒之，爽引还。", "s": "《三国志·曹爽传》"}, {"y": 246, "n": "蒋琬卒", "t": "oth", "f": "蒋琬", "pl": "涪县", "d": "琬卒，费祎代，董允为尚书令。", "s": "《三国志·蒋琬传》"}, {"y": 248, "n": "曹爽专权", "t": "pol", "f": "曹爽", "pl": "洛阳", "d": "晏、飏等用事，司马懿称疾不与政。", "s": "《三国志·曹爽传》"}, {"y": 249, "n": "高平陵之变", "t": "pol", "f": "司马懿", "pl": "洛阳", "d": "懿乘爽陪陵起兵，据洛水，桓范劝爽挟帝赴许，爽罢兵认罪；旋以谋反诛三族。", "s": "《三国志·曹爽传》"}, {"y": 249, "n": "夏侯霸奔蜀", "t": "dip", "f": "夏侯霸", "pl": "汉中", "d": "霸闻爽诛，惧祸奔蜀，后主厚待之。", "s": "《三国志·夏侯渊传附》"}, {"y": 251, "n": "王凌之叛", "t": "war", "f": "司马懿·王凌", "pl": "寿春", "d": "凌谋立楚王彪，懿掩至，凌饮药死，夷三族。", "s": "《三国志·王凌传》"}, {"y": 251, "n": "司马懿卒", "t": "oth", "f": "司马懿", "pl": "洛阳", "d": "太傅懿薨，师、昭兄弟渐专魏政。", "s": "《晋书·宣帝纪》"}, {"y": 252, "n": "孙权崩·孙亮立", "t": "pol", "f": "孙亮", "pl": "建业", "d": "大帝薨，太子亮立，诸葛恪、滕胤辅政。", "s": "《三国志·吴主传》"}, {"y": 252, "n": "东兴之战", "t": "war", "f": "诸葛恪·司马昭", "pl": "东兴", "d": "恪筑东兴堤，魏三路攻之；丁奉雪中奋短兵，大破魏军。", "s": "《三国志·诸葛恪传》"}, {"y": 253, "n": "诸葛恪伐魏失利", "t": "war", "f": "诸葛恪·张特", "pl": "合肥新城", "d": "恪围新城不下，士卒疫死大半，惭恨失望。", "s": "《三国志·诸葛恪传》"}, {"y": 253, "n": "诸葛恪被诛", "t": "pol", "f": "孙峻", "pl": "建业", "d": "峻设酒宴杀恪，灭族，年五十一。", "s": "《三国志·诸葛恪传》"}, {"y": 254, "n": "司马师废立", "t": "pol", "f": "司马师", "pl": "洛阳", "d": "师废曹芳为齐王，立高贵乡公髦。", "s": "《三国志·三少帝纪》"}, {"y": 255, "n": "毌丘俭文钦之叛", "t": "war", "f": "司马师·毌丘俭", "pl": "寿春", "d": "二叛起兵，师带病东征，俭败死，钦奔吴。", "s": "《三国志·毌丘俭传》"}, {"y": 255, "n": "司马师卒", "t": "oth", "f": "司马师", "pl": "许昌", "d": "师目瘤疾作，卒于军（归许昌途），昭继。", "s": "《晋书·景帝纪》"}, {"y": 255, "n": "姜维洮西大捷", "t": "war", "f": "姜维·王经", "pl": "洮西", "d": "维大破魏雍州刺史王经，经众死数万，还保狄道。", "s": "《三国志·姜维传》"}, {"y": 256, "n": "姜维段谷之败", "t": "war", "f": "邓艾·姜维", "pl": "段谷", "d": "艾据武城山、断维归路，维大败，星散流离。", "s": "《三国志·邓艾传》"}, {"y": 257, "n": "诸葛诞之叛", "t": "war", "f": "诸葛诞·司马昭", "pl": "寿春", "d": "诞据寿春反，吴遣文钦等援之，昭督二十六军围之。", "s": "《三国志·诸葛诞传》"}, {"y": 258, "n": "诸葛诞败亡", "t": "war", "f": "司马昭·诸葛诞", "pl": "寿春", "d": "城破，诞突围死，夷三族；文钦先为诞所杀。", "s": "《三国志·诸葛诞传》"}, {"y": 258, "n": "孙綝废孙亮", "t": "pol", "f": "孙綝", "pl": "建业", "d": "綝废亮为会稽王，立琅邪王休。", "s": "《三国志·三嗣主传》"}, {"y": 260, "n": "曹髦讨司马昭遇害", "t": "pol", "f": "曹髦", "pl": "洛阳", "d": "髦率僮仆数百讨昭，为太子舍人成济所弑，年二十。", "s": "《三国志·三少帝纪》"}, {"y": 260, "n": "曹奂继位", "t": "pol", "f": "曹奂", "pl": "洛阳", "d": "昭立陈留王奂，改元景元。", "s": "《三国志·三少帝纪》"}, {"y": 263, "n": "魏灭蜀", "t": "war", "f": "邓艾·钟会·刘禅", "pl": "成都", "d": "钟会主力拒姜维于剑阁；邓艾阴平度险，诸葛瞻战死于绵竹，刘禅出降，蜀亡。", "s": "《三国志·后主传》"}, {"y": 263, "n": "钟会姜维之乱", "t": "war", "f": "钟会·姜维", "pl": "成都", "d": "会伪称太后遗诏讨司马昭，欲据蜀；事泄，为乱兵所杀，姜维同死。", "s": "《三国志·钟会传》"}, {"y": 264, "n": "司马昭称晋王", "t": "pol", "f": "司马昭", "pl": "洛阳", "d": "昭进位晋王，加九锡，国建百揆。", "s": "《晋书·文帝纪》"}, {"y": 264, "n": "孙皓继位", "t": "pol", "f": "孙皓", "pl": "建业", "d": "休薨，迎立孙和子孙皓。", "s": "《三国志·三嗣主传》"}, {"y": 265, "n": "司马昭卒·晋代魏", "t": "pol", "f": "司马炎", "pl": "洛阳", "d": "昭卒，炎嗣晋王，受魏禅，国号晋，改元泰始；魏亡。", "s": "《晋书·武帝纪》"}, {"y": 272, "n": "陆抗平西陵", "t": "war", "f": "陆抗·步阐", "pl": "西陵", "d": "西陵督步阐叛降晋，抗围之，破晋援军，斩阐。", "s": "《三国志·陆抗传》"}, {"y": 274, "n": "陆抗卒", "t": "oth", "f": "陆抗", "pl": "西陵", "d": "抗卒，吴失长城，羊祜益请伐吴。", "s": "《三国志·陆抗传》"}, {"y": 279, "n": "晋六路伐吴", "t": "war", "f": "司马炎", "pl": "长江全线", "d": "命王濬、杜预等六路二十余万大军伐吴。", "s": "《晋书·武帝纪》"}, {"y": 280, "n": "晋灭吴·三国归一", "t": "war", "f": "王濬·孙皓", "pl": "建业", "d": "王濬楼船下建业，孙皓面缚出降，吴亡，天下复归一统。", "s": "《三国志·三嗣主传》"}], "outline": [[130.6, 42.3], [129.5, 42.6], [128.2, 41.9], [126.9, 41.8], [125.9, 41.4], [124.4, 40.2], [123.0, 39.7], [121.8, 39.0], [120.5, 37.7], [120.9, 37.0], [122.7, 37.4], [122.4, 36.9], [121.0, 36.7], [119.8, 35.6], [119.3, 34.7], [120.3, 34.3], [121.9, 32.5], [121.6, 31.4], [121.5, 30.6], [121.8, 29.9], [121.5, 28.7], [120.7, 27.9], [119.6, 26.1], [118.9, 25.1], [118.1, 24.5], [116.8, 23.3], [115.4, 22.8], [114.3, 22.6], [113.7, 22.2], [112.5, 21.7], [111.5, 21.4], [110.5, 21.5], [110.1, 20.3], [109.7, 20.9], [108.3, 21.5], [107.7, 21.4], [106.9, 21.9], [106.6, 22.9], [105.8, 22.9], [105.2, 23.4], [104.5, 22.8], [102.2, 22.4], [100.1, 21.5], [99.3, 22.4], [98.7, 24.0], [97.9, 24.1], [97.5, 23.6], [97.6, 25.2], [96.5, 25.6], [95.3, 26.0], [94.6, 27.8], const mx=lo=>(lo-LON0)/(LON1-LON0)*MW, my=la=>(LAT1-la)/(LAT1-LAT0)*MH;

function pulse(e){e.classList.remove("hlt");void e.getBoundingClientRect();e.classList.add("hlt");}
function tip(ev,html){const t=$("#mapTip");t.innerHTML=html;t.style.display="block";

function hideTip(){$("#mapTip").style.display="none";}

function buildLegend(period){
  const L=$("#mapLegend");const m=period==="c2"?C2C:period==="c219"?C219C:period==="c263"?C263C:null;
  let h=`<div style="color:#d8cfb8;margin-bottom:4px;font-family:var(--serif)">图例${m?"（"+({c2:"200年",c219:"219年",c263:"263年"})[period]+"控制）":""}</div>`;

  L.innerHTML=h;L.style.display="block";
}

/* ---------- GCJ-02 转换（WGS-84 → 高德坐标系） ---------- */
const PI=Math.PI,AX=6378245.0,EE=0.006693421622965943;
function tfLat(x,y){let r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3;r+=(20*Math.sin(y*PI)+40*Math.sin(y/3*PI))*2/3;r+=(160*Math.sin(y/12*PI)+320*Math.sin(y*PI/30))*2/3;return r;}
function tfLon(x,y){let r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3;r+=(20*Math.sin(x*PI)+40*Math.sin(x/3*PI))*2/3;r+=(150*Math.sin(x/12*PI)+300*Math.sin(x/30*PI))*2/3;return r;}
function w2g(lon,lat){if(lon<72.004||lon>137.8347||lat<0.8293||lat>55.8271)return[lon,lat];
  const dLat=tfLat(lon-105,lat-35),dLon=tfLon(lon-105,lat-35);
  const rad=lat/180*PI;let magic=Math.sin(rad);magic=1-EE*magic*magic;const sq=Math.sqrt(magic);
  return [lon+(dLon*180)/(AX/magic*Math.cos(rad)*sq*PI), lat+(dLat*180)/((AX*(1-EE))/(magic*sq)*PI)];}
function mercY(lat){return 0.5-Math.log(Math.tan(PI/4+lat*PI/180/2))/(2*PI);}

/* ---------- 要素绘制（屏幕固定尺寸） ---------- */
function drawFeatures(ov,P){
  const period=$("#periodSel").value;
  DATA.cmd.forEach((c,idx)=>{
    const col=cmdColor(period==="none"?"":c[period],period);
    const [px,py]=P(c.lon,c.lat);
    if(px<-40||py<-40||px>ov.clientWidth+40||py>ov.clientHeight+40)return;
    const ce=el("circle",{cx:px,cy:py,r:c.imp==2?6.5:4.5,fill:col,stroke:"#0e1218cc","stroke-width":1});
    ce.style.cursor="pointer";
    ce.addEventListener("mousemove",ev=>tip(ev,`<b>${esc(c.n)}</b><br>治所：${esc(c.seat)}<br>今址：${esc(c.mod)}`));
    ce.addEventListener("mouseleave",hideTip);
    ce.addEventListener("click",ev=>{ev.stopPropagation();showPanel(c);pulse(ce);});
    ov.appendChild(ce);
    const zok=view.z>=6||period!=="none"&&vb.w<1300;
    if((zok&&view.z>=6)||(vb.w<1300)||c.imp==2){
      if($("#baseSel")&&$("#baseSel").value!=="demo"&&view.z<6&&c.imp!==2)return;
      if(c.imp==2||(($("#baseSel").value==="demo"&&vb.w<1300)||view.z>=6)){
        const side=(idx%2==0)?1:-1;
        const t=el("text",{x:px+8*side,y:py+(idx%3-1)*3,fill:"#fff","font-size":12,"font-family":"var(--serif)","text-anchor":side>0?"start":"end","paint-order":"stroke",stroke:"#00000088","stroke-width":3});
        t.textContent=c.n;ov.appendChild(t);
      }
    }
  });
  if($("#showCities").checked)DATA.cit.forEach(c=>{
    const [px,py]=P(c.lon,c.lat);
    if(px<-40||py<-40||px>ov.clientWidth+40||py>ov.clientHeight+40)return;
    const d=el("path",{d:`M${px},${py-6} L${px+6},${py} L${px},${py+6} L${px-6},${py} Z`,fill:"#ffd977",stroke:"#0e1218cc","stroke-width":.8});
    d.style.cursor="pointer";
    d.addEventListener("mousemove",ev=>tip(ev,`<b>${esc(c.n)}</b><br>${esc(c.mod)}<br><span style="color:#8a93a6">${esc(c.note)}</span>`));
    d.addEventListener("mouseleave",hideTip);
    d.addEventListener("click",ev=>{ev.stopPropagation();showCity(c);pulse(d);});
    ov.appendChild(d);
    if(view.z>=8||(vb.w<760&&$("#baseSel").value==="demo")){
      const t=el("text",{x:px+8,y:py-5,fill:"#ffe9b0","font-size":12,"paint-order":"stroke",stroke:"#00000088","stroke-width":3});
      t.textContent=c.n.replace(/（.*?）/,"");ov.appendChild(t);}
  });
  if($("#showPass").checked)DATA.passes.forEach(c=>{
    const [px,py]=P(c.lon,c.lat);
    if(px<-40||py<-40||px>ov.clientWidth+40||py>ov.clientHeight+40)return;
    const d=el("path",{d:`M${px},${py-6} L${px+6},${py+5} L${px-6},${py+5} Z`,fill:"#ff9d5c",stroke:"#0e1218cc","stroke-width":1});
    d.style.cursor="pointer";
    d.addEventListener("mousemove",ev=>tip(ev,`<b>${esc(c.n)}</b><br>${esc(c.mod)}<br><span style="color:#8a93a6">${esc(c.note)}</span>`));
    d.addEventListener("mouseleave",hideTip);
    d.addEventListener("click",ev=>{ev.stopPropagation();showCity(c);pulse(d);});
    ov.appendChild(d);
    if(view.z>=8||(vb.w<760&&$("#baseSel").value==="demo")){
      const t=el("text",{x:px+9,y:py+2,fill:"#ffb380","font-size":12,"paint-order":"stroke",stroke:"#00000088","stroke-width":3});
      t.textContent=c.n;ov.appendChild(t);}
  });
  if($("#showCounty").checked)DATA.cty.forEach(c=>{
    const [px,py]=P(c.lon,c.lat);
    if(px<-30||py<-30||px>ov.clientWidth+30||py>ov.clientHeight+30)return;
    const d=el("circle",{cx:px,cy:py,r:2.6,fill:"#8fd0aa",stroke:"#0e1218cc","stroke-width":.8});
    d.style.cursor="pointer";
    d.addEventListener("mousemove",ev=>tip(ev,`<b>${esc(c.n)}</b>（${esc(c.c)}）<br>${esc(c.mod)}`));
    d.addEventListener("mouseleave",hideTip);
    d.addEventListener("click",ev=>{ev.stopPropagation();showCity({n:c.n+"（"+c.c+"属县）",mod:c.mod,note:"见《续汉书·郡国志五》"});pulse(d);});
    ov.appendChild(d);
    if(view.z>=9){
      const t=el("text",{x:px+6,y:py+3,fill:"#a9dcc0","font-size":12,"paint-order":"stroke",stroke:"#00000088","stroke-width":3});
      t.textContent=c.n;ov.appendChild(t);}
  });
  buildLegend(period);
}

/* ---------- 模式一：示意底图（原 viewBox 方案） ---------- */
function renderDemo(){
  const wrap=$("#mapWrap"),W=wrap.clientWidth,H=wrap.clientHeight;
  const svg=$("#mapSvg");svg.style.display="block";$("#tiles").innerHTML="";
  svg.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const ov=$("#ovSvg");ov.innerHTML="";
  const sc=W/vb.w;
  const pts=DATA.outline.map(p=>mx(p[0]).toFixed(1)+","+my(p[1]).toFixed(1)).join(" ");
  svg.innerHTML=`<polygon points="${pts}" fill="#1c2634" stroke="#3a4a5f" stroke-width="1.2"/>
  <circle cx="${mx(109.8)}" cy="${my(19.2)}" r="${my(18.6)-my(19.6)}" fill="#1c2634" stroke="#3a4a5f"/>`;
  drawFeatures(ov,(lo,la)=>[(mx(lo)-vb.x)*sc,(my(la)-vb.y)*sc]);
}

/* ---------- 模式二：高德底图（街道/卫星） ---------- */
function renderTiles(){
  const wrap=$("#mapWrap"),W=wrap.clientWidth,H=wrap.clientHeight;
  $("#mapSvg").style.display="none";
  const tl=$("#tiles");tl.innerHTML="";
  const ov=$("#ovSvg");ov.innerHTML="";
  const base=$("#baseSel").value;
  const sc=256*Math.pow(2,view.z);
  const g=w2g(view.lon,view.lat);
  const cx=(g[0]+180)/360*sc, cy=mercY(g[1])*sc;
  const x0=Math.floor((cx-W/2)/256),x1=Math.floor((cx+W/2)/256);
  const y0=Math.floor((cy-H/2)/256),y1=Math.floor((cy+H/2)/256);
  if(base!=="none")for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){
    const img=document.createElement("img");
    const s=(Math.abs(x+y)%4)+1;
    img.src= base==="asat"
      ? `https://webst0${s}.is.autonavi.com/appmaptile?style=6&x=${x}&y=${y}&z=${view.z}`
      : `https://webrd0${s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x=${x}&y=${y}&z=${view.z}`;
    img.draggable=false;
    img.style.cssText=`position:absolute;left:${Math.round(W/2+(x*256-cx))}px;top:${Math.round(H/2+(y*256-cy))}px;width:256px;height:256px;user-select:none`;
    img.onerror=function(){this.style.visibility="hidden";};
    tl.appendChild(img);
  }
  drawFeatures(ov,(lo,la)=>{const gg=w2g(lo,la);return[W/2+(((gg[0]+180)/360*sc)-cx),H/2+(mercY(gg[1])*sc)-cy];});
}
function renderMap(){
  if($("#baseSel").value==="demo")renderDemo();
  else renderTiles();
}

/* ---------- 缩放与拖拽（双模式统一） ---------- */
function isDemo(){return $("#baseSel").value==="demo";}
$("#zin").onclick=()=>{if(isDemo()){const cx=vb.x+vb.w/2,cy=vb.y+vb.h/2;vb.w=Math.min(MW,Math.max(460,vb.w*0.72));vb.h=vb.w*MH/MW;vb.x=Math.min(Math.max(cx-vb.w/2,0),MW-vb.w);vb.y=Math.min(Math.max(cy-vb.h/2,0),MH-vb.h);}else view.z=Math.min(17,view.z+1);renderMap();};
$("#zout").onclick=()=>{if(isDemo()){const cx=vb.x+vb.w/2,cy=vb.y+vb.h/2;vb.w=Math.min(MW,Math.max(460,vb.w*1.38));vb.h=vb.w*MH/MW;vb.x=Math.min(Math.max(cx-vb.w/2,0),MW-vb.w);vb.y=Math.min(Math.max(cy-vb.h/2,0),MH-vb.h);}else view.z=Math.max(3,view.z-1);renderMap();};
$("#zreset").onclick=()=>{vb={x:0,y:0,w:MW,h:MH};view={lon:108.5,lat:34.5,z:5};renderMap();};
let drag=null;
$("#mapWrap").addEventListener("mousedown",e=>{if(e.target.closest("#mapPanel")||e.target.closest(".mapCtl"))return;drag={x:e.clientX,y:e.clientY};});
window.addEventListener("mousemove",e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};
  if(isDemo()){
    const s=$("#mapWrap").clientWidth/vb.w;
    vb.x=Math.min(Math.max(vb.x-dx/s,0),MW-vb.w);vb.y=Math.min(Math.max(vb.y-dy/s,0),MH-vb.h);
  }else{
    const sc=256*Math.pow(2,view.z);const g=w2g(view.lon,view.lat);
    let wx=(g[0]+180)/360*sc-dx, wy=mercY(g[1])*sc-dy;
    view.lon=wx/sc*360-180;
    view.lat=Math.max(-75,Math.min(75,(2*Math.atan(Math.exp((0.5-wy/sc)*2*PI))-PI/2)*180/PI));
  }
  renderMap();
});
window.addEventListener("mouseup",()=>drag=null);
$("#mapWrap").addEventListener("wheel",e=>{e.preventDefault();if(isDemo()){const f=e.deltaY>0?1.15:0.87;const cx=vb.x+vb.w/2,cy=vb.y+vb.h/2;vb.w=Math.min(MW,Math.max(460,vb.w*f));vb.h=vb.w*MH/MW;vb.x=Math.min(Math.max(cx-vb.w/2,0),MW-vb.w);vb.y=Math.min(Math.max(cy-vb.h/2,0),MH-vb.h);}else view.z=Math.max(3,Math.min(17,view.z+(e.deltaY>0?-1:1)));renderMap();},{passive:false});
$("#periodSel").onchange=renderMap;$("#showCities").onchange=renderMap;$("#showPass").onchange=renderMap;$("#showCounty").onchange=renderMap;
$("#baseSel").onchange=()=>{$("#mapPanel").style.display="none";renderMap();};
$("#mapWrap").addEventListener("click",e=>{if(e.target.id==="mapWrap"||e.target.tagName==="svg"||e.target.id==="tiles")$("#mapPanel").style.display="none";});
function gotoPlace(lon,lat,cb){
  if(curView!=="map")document.querySelector('.tab[data-v="map"]').click();
  if(isDemo()){
    vb.w=Math.min(MW,1080);vb.h=vb.w*MH/MW;
    vb.x=Math.min(Math.max(mx(lon)-vb.w/2,0),MW-vb.w);vb.y=Math.min(Math.max(my(lat)-vb.h/2,0),MH-vb.h);
  }else{
    view={lon,lat,z:9};
  }
  renderMap();cb();
}

const Y0=150,Y1=285,PX=16,LEFT=0,EVH=172,ROW=24;
const X=yr=>10+(yr-Y0)*PX;
const TLW=X(Y1)+40;
let tlBuilt=false;
const FORDER=["魏","蜀","吴","群雄","其他"];
const FKEY={"魏":"fWei","蜀":"fShu","吴":"fWu","群雄":"fQun","其他":"fQun"};
function forceOn(f){return $("#"+FKEY[f]).checked;}
function personVisible(p){
  if(!forceOn(p.f))return false;
  if($("#fFull").checked&&!(p.b&&p.d))return false;
  return true;
}
function renderTL(){
  const canvas=$("#tlCanvas"),nameS=$("#nameScroll");
  canvas.innerHTML='<div id="cursor"></div><div id="cursorYear"></div><div id="tlLegend"></div>';
  nameS.innerHTML='';const ngap=document.createElement("div");ngap.className="gap";nameS.appendChild(ngap);
  /* 年份网格 */
  for(let y=Y0;y<=Y1;y++){
    const g=document.createElement("div");
    g.className="ygrid"+(y%10==0?" major":"");
    g.style.left=X(y)+"px";canvas.appendChild(g);
    if(y%10==0){const l=document.createElement("div");l.className="ylab";l.style.left=X(y)+"px";l.textContent=y;canvas.appendChild(l);}
  }
  /* 事件旗标 */
  const lanes=[-1,-1,-1,-1,-1];
  const evs=DATA.ev.slice().sort((a,b)=>a.y-b.y);
  const laneNames=["战争/军事行动","政治事件","外交/盟约","其他大事","（续）"];
  laneNames.forEach((n,i)=>{const l=document.createElement("div");l.className="evLaneLab";l.style.top=(10+i*30)+"px";l.textContent=n;canvas.appendChild(l);});
  evs.forEach(ev=>{
    let lane=0;for(let i=0;i<5;i++)if(X(ev.y)-lanes[i]>110){lane=i;break;}
    lanes[lane]=X(ev.y);
    const f=document.createElement("div");
    f.className="evFlag";f.style.left=X(ev.y)+"px";f.style.top=(8+lane*30)+"px";f.style.color=EVCH[ev.t];
    f.innerHTML=EVI[ev.t]+`<span class="lb">${esc(ev.n)}</span>`;
    f.title=ev.y+"年 · "+ev.n;
    f.onclick=()=>openEvent(ev);
    f.dataset.y=ev.y;f.dataset.n=ev.n;
    canvas.appendChild(f);
  });
  /* 人物行 */
  const groups={};FORDER.forEach(f=>groups[f]=DATA.per.filter(p=>p.f===f&&personVisible(p)));
  FORDER.forEach(f=>groups[f].sort((a,b)=>((a.b||a.d||9999)-(b.b||b.d||9999))));
  let y=EVH;const nameY=[];
  FORDER.forEach(f=>{
    const list=groups[f];
    if(!list.length)return;
    const gh=document.createElement("div");gh.className="grp";gh.style.top=y+"px";gh.style.height="30px";gh.style.width=TLW+"px";
    gh.innerHTML=`${f} <small>${list.length}人</small>`;canvas.appendChild(gh);
    const nh=document.createElement("div");nh.className="ngrp";
    nh.innerHTML=`${f} <small>${list.length}人</small>`;nameS.appendChild(nh);
    y+=30;
    list.forEach(p=>{
      const row=document.createElement("div");row.className="prow";row.style.top=y+"px";row.style.width=TLW+"px";row.dataset.n=p.n;
      const line=document.createElement("div");line.className="pline";
      const col=FCH[p.f];
      if(p.b&&p.d){
        line.style.left=X(p.b)+"px";line.style.width=(X(p.d)-X(p.b))+"px";line.style.background=col;
        const b=document.createElement("div");b.className="pdot";b.style.left=X(p.b)+"px";b.style.background=col;b.title="生 "+p.b;
        const d=document.createElement("div");d.className="pdie";d.style.left=X(p.d)+"px";d.style.color=col;d.textContent="✕";d.title="卒 "+p.d;
        row.appendChild(line);row.appendChild(b);row.appendChild(d);
      }else{
        const yr=p.b||p.d;
        line.style.left=X(Math.max(Y0,yr-8))+"px";line.style.width=(X(yr)-X(Math.max(Y0,yr-8)))+"px";line.style.background="repeating-linear-gradient(90deg,"+col+" 0 6px,transparent 6px 11px)";
        const m=document.createElement("div");m.className="pdie";m.style.left=X(yr)+"px";m.style.color=col;
        m.textContent=p.d?("✕ "+p.d):("? "+p.b);m.title=(p.d?"卒 "+p.d:"生 "+p.b)+"（生卒未详，虚线示意）";
        row.appendChild(line);row.appendChild(m);
      }
      row.onclick=()=>openPerson(p);
      canvas.appendChild(row);
      const nl=document.createElement("div");nl.className="nrow";nl.dataset.n=p.n;
      nl.innerHTML=`<span style="color:${col};font-family:var(--serif)">${esc(p.n)}</span><span style="color:#5f6875;font-size:11px">${esc(p.z||"")}</span><span class="ny">${p.b||"?"}–${p.d||"?"}</span>`;
      nl.onclick=()=>openPerson(p);
      nameS.appendChild(nl);
      y+=ROW;
    });
  });
  /* 生卒不详 */
  const nulls=DATA.per.filter(p=>!p.b&&!p.d&&forceOn(p.f));
  if(nulls.length){
    const nb=document.createElement("div");nb.className="grp";nb.style.top=y+"px";nb.style.height="30px";nb.style.width=TLW+"px";
    nb.innerHTML=`生卒年不详 <small>${nulls.length}人（可检索、点击见传）</small>`;canvas.appendChild(nb);
    const nb2=document.createElement("div");nb2.className="ngrp";nb2.innerHTML=`生卒年不详 <small>${nulls.length}人</small>`;nameS.appendChild(nb2);
    y+=30;
    const box=document.createElement("div");box.className="nullbox";box.style.top=y+"px";box.style.width=(TLW-20)+"px";
    nulls.forEach(p=>{
      const c=document.createElement("span");c.className="nullchip";c.textContent=p.n+(p.z?"·"+p.z:"");
      c.onclick=()=>openPerson(p);box.appendChild(c);
    });
    canvas.appendChild(box);
    const bh=Math.ceil(nulls.length/4)*34+70;
    const filler=document.createElement("div");filler.style.height=bh+"px";filler.style.padding="10px";filler.style.color="#5f6875";filler.style.fontSize="12px";filler.textContent="此栏人物生卒年不详，见右侧名录，或检索其姓名";nameS.appendChild(filler);
    y+=bh;
  }
  canvas.style.width=TLW+"px";canvas.style.height=y+"px";
  buildTlLegend();
  syncName();
  tlBuilt=true;
}
function buildTlLegend(){
  let h=`<div style="color:#d8cfb8;font-family:var(--serif);margin-bottom:4px">图例</div>`;
  h+=`<div class="li"><span style="color:var(--wei)">━━</span> 魏人物（155年起线）</div>`;
  h+=`<div class="li"><span style="color:var(--shu)">━━</span> 蜀人物</div><div class="li"><span style="color:var(--wu)">━━</span> 吴人物</div>`;
  h+=`<div class="li"><span style="color:var(--qun)">━━</span> 群雄 / 其他</div>`;
  h+=`<div class="li"><span style="color:#e8e2d5">●──✕</span> 出生→卒年</div>`;
  h+=`<div class="li"><span style="color:#8a93a6">╌╌✕</span> 生卒未详（示意）</div>`;
  for(const k in EVI)h+=`<div class="li"><span style="color:${EVCH[k]}">${EVI[k]}</span> ${EVN[k]}</div>`;
  $("#tlLegend").innerHTML=h;
}
const tlScroll=$("#tlScroll");
tlScroll.addEventListener("scroll",syncName);
function syncName(){document.getElementById("nameBox").scrollTop=tlScroll.scrollTop;}
["fWei","fShu","fWu","fQun","fFull"].forEach(id=>$("#"+id).addEventListener("change",renderTL));
$("#goBtn").onclick=()=>{const y=parseInt($("#goYear").value);if(y)gotoYear(y);};
$("#goYear").addEventListener("keydown",e=>{if(e.key==="Enter")$("#goBtn").click();});
function gotoYear(y){
  if(curView!=="tl"){document.querySelector('.tab[data-v="tl"]').click();}
  tlScroll.scrollTo({left:X(y)-tlScroll.clientWidth/2,behavior:"smooth"});
  const cy=$("#cursor"),cyr=$("#cursorYear");
  cy.style.display="block";cy.style.left=X(y)+"px";
  cyr.style.display="block";cyr.style.left=X(y)+"px";cyr.textContent=y+"年";
  setTimeout(()=>{cy.style.display="none";cyr.style.display="none";},2600);
  const evs=DATA.ev.filter(e=>e.y===y);
  if(evs.length){const box=$("#playBox");box.style.display="block";
    $("#playTitle").textContent=y+"年大事";
    $("#playList").innerHTML=evs.map(e=>`<div><b style="color:${EVCH[e.t]}">${EVI[e.t]}</b> <b>${esc(e.n)}</b>　<span style="color:#7d8694">${esc(e.pl)}</span><br><span style="color:#a8a192">${esc(e.d)}</span></div>`).join("");}
}
/* 播放 */
let playing=false,py=0,ptimer=null;
$("#playBtn").onclick=()=>{
  if(playing){stopPlay();return;}
  if(curView!=="tl")document.querySelector('.tab[data-v="tl"]').click();
  playing=true;py=184;$("#playBtn").textContent="⏸ 暂停";$("#playBox").style.display="block";
  $("#playTitle").textContent="时间巡览：184年始";
  $("#playList").innerHTML="";
  tlScroll.scrollTo({left:X(py)-100});
  ptimer=setInterval(()=>{
    if(py>280){stopPlay();return;}
    const cy=$("#cursor"),cyr=$("#cursorYear");
    cy.style.display="block";cy.style.left=X(py)+"px";
    cyr.style.display="block";cyr.style.left=X(py)+"px";cyr.textContent=py+"年";
    if(py%5===0)tlScroll.scrollTo({left:X(py)-tlScroll.clientWidth/3,behavior:"smooth"});
    const evs=DATA.ev.filter(e=>e.y===py);
    evs.forEach(e=>{
      $("#playList").innerHTML=`<div><b style="color:${EVCH[e.t]}">${EVI[e.t]}</b> <b>${py}年 · ${esc(e.n)}</b>　<span style="color:#7d8694">${esc(e.pl)}</span><br><span style="color:#a8a192">${esc(e.d)}</span></div>`+$("#playList").innerHTML;
      const flag=[...document.querySelectorAll(".evFlag")].find(f=>+f.dataset.y===py&&f.dataset.n===e.n);
      if(flag)pulse(flag);
    });
    py++;
  },260);
};
function stopPlay(){playing=false;clearInterval(ptimer);$("#playBtn").textContent="▶ 播放 184–280";$("#cursor").style.display="none";$("#cursorYear").style.display="none";}

/* ================= 弹窗 ================= */
function openPerson(p){
  const col=FCH[p.f];
  const yearStr=(p.b||"?")+" — "+(p.d||"?")+"　"+p.f;
  const sec=(t,b,empty)=>`<div class="sec"><h3>${t}</h3><div class="body">${b?b:`<span class="empty">${empty}</span>`}</div></div>`;
  const basic=`<div class="body">
<b style="color:${col}">${esc(p.n)}</b>${p.z?`，字${esc(p.z)}`:""}　${esc(p.f)}势力
籍贯：${esc(p.p||"不详")}
生卒：${p.b?p.b+"年":"不详"} — ${p.d?p.d+"年":"不详"}
出处：${esc(p.s||"不详")}${p.t?`\n备考：${esc(p.t)}`:""}</div>`;
  $("#modal").innerHTML=`<button id="mClose">✕</button>
    <h2>${esc(p.n)}${p.z?`<span style="font-size:15px;color:#a8a192;margin-left:10px">字${esc(p.z)}</span>`:""}</h2>
    <div class="meta"><span class="chip" style="background:${col}">${esc(p.f)}</span><span>${yearStr}</span><span style="color:#7d8694">${esc(p.p||"")}</span></div>
    ${sec("一 · 基本信息",basic)}
    ${sec("二 · 主要经历（本传概述）",esc(p.g),"本传概述待补")}
    ${sec("三 · 经历原文摘录",esc(p.e),(p.s&&p.s.indexOf("晋书")>-1?"《晋书》帝纪原文未录（可于中华书局点校本《晋书》检读）":"本传原文未录（可于中华书局点校本《三国志》检读）"))}
    ${sec("四 · 相貌体征（《三国志》原文）",esc(p.m),(p.s&&p.s.indexOf("晋书")>-1)?"《三国志》未为其立传，故无容貌之载":"本传未载其容貌体征")}
    ${sec("五 · 陈寿评曰",esc(p.c),p.s&&p.s.indexOf("晋书")>-1?"《三国志》未立传，无陈寿评":"陈寿本卷评语此未录")}
    ${sec("六 · 裴松之注（节选）",esc(p.v),(p.s&&p.s.indexOf("晋书")>-1?"《晋书》无裴松之注——裴注系陈寿《三国志》所独有，本工具一仍其旧":"本传裴注甚繁，此未节录；清人卢弼《三国志集解》最便检读"))}
    <div class="src">资料来源：${esc(p.s||"")}　｜　本工具仅录可核实之原文，阙者明示，不敢妄补。</div>`;
  $("#mask").style.display="flex";
  $("#mClose").onclick=closeModal;
}
function openEvent(ev){
  $("#modal").innerHTML=`<button id="mClose">✕</button>
    <h2>${esc(ev.n)}</h2>
    <div class="meta"><span class="chip" style="background:${EVCH[ev.t]}">${EVN[ev.t]}</span><span>${ev.y}年</span><span style="color:#a8a192">地点：${esc(ev.pl)}</span><span style="color:#a8a192">主导：${esc(ev.f)}</span></div>
    <div class="sec"><h3>事件概述</h3><div class="body">${esc(ev.d)}</div></div>
    <div class="src">依据：${esc(ev.s)}</div>`;
  $("#mask").style.display="flex";$("#mClose").onclick=closeModal;
}
function closeModal(){$("#mask").style.display="none";}
$("#mask").addEventListener("click",e=>{if(e.target.id==="mask")closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

/* ================= 检索 ================= */
const idx=[];
DATA.per.forEach(p=>idx.push({t:"人",k:p.n+(p.z||""),n:p.n,sub:(p.b||"?")+"-"+(p.d||"?")+" · "+p.f,col:FCH[p.f],act:()=>{gotoPerson(p);}}));
DATA.ev.forEach(ev=>idx.push({t:"事",k:ev.n+ev.pl+ev.f,n:ev.n,sub:ev.y+"年 · "+ev.pl,col:EVCH[ev.t],act:()=>{gotoYear(ev.y);setTimeout(()=>{const f=[...document.querySelectorAll(".evFlag")].find(f=>+f.dataset.y===ev.y&&f.dataset.n===ev.n);if(f){pulse(f);f.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});}},700);}}));
DATA.cmd.forEach(c=>idx.push({t:"地",k:c.n+c.seat+c.mod,n:c.n,sub:"郡国 · 治所"+c.seat+" · "+c.mod,col:"#8a93a6",act:()=>gotoPlace(c.lon,c.lat,()=>showPanel(c))}));
DATA.cit.forEach(c=>idx.push({t:"城",k:c.n+c.mod+c.note,n:c.n,sub:"城池 · "+c.mod,col:"#d8cfb8",act:()=>gotoPlace(c.lon,c.lat,()=>showCity(c))}));
DATA.cty.forEach(c=>idx.push({t:"县",k:c.n+c.c+c.mod,n:c.n,sub:c.c+"属县 · "+c.mod,col:"#7fa88f",act:()=>gotoPlace(c.lon,c.lat,()=>showCity({n:c.n+"（"+c.c+"属县）",mod:c.mod,note:"见《续汉书·郡国志五》"}))}));
DATA.passes.forEach(c=>idx.push({t:"隘",k:c.n+c.mod+c.note,n:c.n,sub:"关隘 · "+c.mod,col:"#e0a458",act:()=>gotoPlace(c.lon,c.lat,()=>showCity(c))}));
for(let y=150;y<=286;y++)idx.push({t:"年",k:String(y),n:y+"年",sub:"大事 "+DATA.ev.filter(e=>e.y===y).length+" 件",col:"#e0b84f",act:()=>gotoYear(y)});
$("#q").addEventListener("input",()=>{
  const v=$("#q").value.trim(),box=$("#results");
  if(!v){box.style.display="none";return;}
  let hit;
  if(/^\d{3,4}$/.test(v)){const y=parseInt(v);hit=idx.filter(i=>i.t==="年"&&i.n===y+"年").concat(idx.filter(i=>i.t!=="年"&&(i.k.includes(v)||i.n.includes(v))).slice(0,8));}
  else hit=idx.filter(i=>i.k.includes(v)).slice(0,14);
  if(!hit.length){box.innerHTML='<div class="res"><span style="color:#6d7684;padding:4px">无匹配结果</span></div>';box.style.display="block";return;}
  box.innerHTML=hit.map((h,i)=>`<div class="res" data-i="${idx.indexOf(h)}"><span class="tag" style="background:${h.col}">${h.t}</span><span>${esc(h.n)}</span><span class="sub">${esc(h.sub)}</span></div>`).join("");
  box.style.display="block";
  box.querySelectorAll(".res").forEach(r=>r.onclick=()=>{box.style.display="none";$("#q").value="";idx[+r.dataset.i].act();});
});
function gotoPerson(p){
  if(curView!=="tl")document.querySelector('.tab[data-v="tl"]').click();
  renderTL();
  const target=[...document.querySelectorAll("#nameScroll>div")].find(d=>d.dataset.n===p.n);
  if(target){
    tlScroll.scrollTo({top:target.offsetTop-160,behavior:"smooth"});
    const row=[...document.querySelectorAll(".prow")].find(r=>r.dataset.n===p.n);
    if(row)setTimeout(()=>pulse(row),600);
    setTimeout(()=>openPerson(p),900);
  }else openPerson(p);
}

/* ================= 郡县表 ================= */
function renderTbl(){
  const tb=document.querySelector("#tbl tbody");
  const draw=()=>{
    const v=$("#tblQ").value.trim();
    tb.innerHTML=DATA.cmd.filter(c=>!v||c.n.includes(v)||c.seat.includes(v)||c.mod.includes(v))
      .map(c=>`<tr><td>${esc(c.n)}</td><td>${esc(c.seat)}</td><td>${esc(c.mod)}</td><td>${chip(c.c2,C2C[c.c2]||"#8a93a6")}</td><td>${chip(c.c219,C219C[c.c219]||"#8a93a6")}</td><td>${chip(c.c263,C263C[c.c263]||"#8a93a6")}</td></tr>`).join("");
  };
  $("#tblQ").addEventListener("input",draw);draw();
}
renderTbl();

/* ================= 说明 ================= */
$("#about").innerHTML=`
<h2>一、资料依据</h2>
<div>本工具全部内容以 <b>陈寿《三国志》</b>（中华书局点校本系统）及 <b>裴松之注</b> 为唯一文本依据；郡国治所与今地名对照，依据《续汉书·郡国志》及谭其骧《中国历史地图集》通行考证。生卒年阙如者标「不详」，卒年存疑者于「备考」注明。<b>凡记忆未审之原文，一律不录，宁阙毋妄。</b></div>
<h2>二、地图使用</h2>
<div>· 右上角选择归属时点：可切换 <b>建安五年（200）、建安二十四年（219）、景元四年（263）</b> 三个断面，郡国圆点按当时控制势力着色；<br>· 底图可切换：示意图／<b>高德街道</b>／<b>高德卫星影像</b>／纯点位；在线底图模式下滚轮缩放、拖拽平移（坐标已做 WGS-84→GCJ-02 校正）；所有标识与文字保持固定大小，不随缩放变化；<br>· 点击圆点（郡国）／菱形（城池·战场）／三角（关隘），右侧面板显示 <b>治所、今址</b> 与三个时点归属；<br>· 「郡县总表」可按名称/治所/今址筛选，与 CSV 资料表配套使用。</div>
<h2>三、时间轴使用</h2>
<div>· 横轴为公元年份（150–285），纵列人物按势力分组；<b>●为出生、✕为卒年</b>，实线连接生卒；生卒不详者以虚线示意并汇总于底部；<br>· 顶部为事件旗标：⚔战争 ★政治 ◈外交 ●其他；点击旗标或人名，弹出原文摘录弹窗（基本信息／经历概述／本传原文／陈寿评曰／裴松之注 五栏）；<br>· 「播放」按钮以动画巡览184–280年大事；<br>· 顶部检索框支持 <b>人名、事件名、年份、地名</b> 四类查询，选中后自动平滑滚动定位并高亮。</div>
<h2>四、颜色与标志</h2>
<div><span class="chip" style="background:#5b8dd6">魏</span> <span class="chip" style="background:#58a05c">蜀</span> <span class="chip" style="background:#d6655b">吴</span> <span class="chip" style="background:#c9a445">群雄·其他</span>　事件：<span style="color:#e2703a">⚔ 战争</span>、<span style="color:#e0b84f">★ 政治</span>、<span style="color:#4fb8c9">◈ 外交</span>、<span style="color:#9aa2ad">● 其他</span></div>
<h2>五、范围说明（务必阅读）</h2>
<div>《三国志》全书纪传人物逾千，本工具收录 <b>${DATA.per.length} 位人物</b>，不限于魏蜀吴传主，兼及东汉朝廷文武（皇甫嵩、卢植、朱儁、孔融、郑玄等）、讨董群雄、诸势力部下（纪灵、颜良文丑、郭图逢纪、蒯越蔡瑁、严颜张任等）、吕布董卓余部、边疆民族与方外人物（蹋顿、轲比能、于夫罗、卑弥呼等）；凡《三国志》无传者，均于「出处」栏标明《后汉书》或仅见裴注，不敢混同。${DATA.cmd.length} 郡国、${DATA.cit.length} 座要邑、${DATA.ev.length} 件大事。司马懿、司马师、司马昭及羊祜、杜预、王濬等，<b>《三国志》未立传</b>（陈寿仕晋之故），其事迹附载并注明《晋书》出处——本次应约将司马懿、司马师、司马昭三人按《晋书》帝纪扩展收录（含帝纪原文摘录）；貂蝉等演义虚构人物不入史实，特设一条说明以正视听。后续可在此框架上继续补全其余传主与人物。</div>
<h2>六、配套资料</h2>
<div>随工具附 CSV 资料表（郡国经纬与今址、人物生卒、大事年表），可直接导入 Excel / GIS 继续整理。</div>`;
